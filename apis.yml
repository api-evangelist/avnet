description: 'Avnet is a global technology distributor and solutions provider that delivers electronic components,
  embedded solutions, and design and supply chain services to industrial and commercial customers. It publishes
  two API surfaces: the Avnet API Portal (apiportal.avnet.com, launched June 2025) for procurement data such as
  real-time price and availability across its Avnet, Abacus, Silica and EBV Elektronik trading companies, gated
  behind per-product subscription approval; and the /IOTCONNECT IoT platform (iotconnect.io), whose eight REST modules
  — master, authenticate, user, device, firmware, event, telemetry and file — serve live Swagger definitions and
  ship first-party device and REST SDKs on GitHub and PyPI.'
