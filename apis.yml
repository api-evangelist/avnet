- name: Avnet API Portal (Procurement APIs)
  description: 'Avnet''s distribution-business API programme, relaunched in June 2025 on a global Azure API Management
    portal: real-time price and availability (getPriceAndQty), inventory and product information for the Avnet,
    Avnet Abacus, Avnet Silica and EBV Elektronik trading companies. Access is per API Product by approved subscription
    (Ocp-Apim-Subscription-Key) plus an OAuth 2.0 client-credentials bearer token; the product list and downloadable
