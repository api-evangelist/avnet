openapi: 3.2.0
info:
  title: /IOTCONNECT™ Firmware OTA API
  description: 'Firmware REST API contains information of Device modules. It will give API methods to firmware communication and OTA.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: OTA
  description: OTA Api List
paths:
  /api/v2/ota-update:
    post:
      tags:
      - OTA
      summary: Send OTA update
      description: 'This API endpoint allows you to send OTA updates to devices.


        Here, firmwareUpgradeGuid is a firmware software version guid. The entityGuid defines this software update will be available for which entity devices. Send true in isForceUpdate parameter, if you wish devices to update this software forcefully. If you want to send this software update to devices at some particular time, send the date in scheduledOn parameter.


        target value should be 1,2 or 3'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that OTA update process started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTAUpdateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            firmware not found, firmware upgrade file not found, firmware upgrade not found, invalid entity, schedule on is past datetime,

            device template not found and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTAUpdateRequest'
        description: scheduledOn should be on format - YYYY-MM-DD HH:mm:ss.
      operationId: postApiV2OtaUpdate
      x-operation-id-source: derived
    get:
      tags:
      - OTA
      summary: Get OTA update sent list
      description: 'This API endpoint gives you the list of OTA updates that you have sent to devices. This also gives you the OTA update status, indicating that in how many devices it is updated, or still pending or failed to update.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order/ex:hardware,software,forceupdate,updatedDate,updatedBy,entity asc
        schema:
          type: string
      - name: Software
        in: query
        description: Software version for search
        schema:
          type: string
      - name: Hardware
        in: query
        description: Hardware version for search
        schema:
          type: string
      - name: IsForceUpdate
        in: query
        description: Send true to get only those OTA updates which are enabled force update
        schema:
          type: string
      - name: Entity
        in: query
        description: Entity name for search
        schema:
          type: string
      - name: IsScheduled
        in: query
        description: Send true to get scheduled OTA updates
        schema:
          type: string
      - name: Status
        in: query
        description: Search with status, Eg. pending, success, failed, sent, skipped, executed etc.
        schema:
          type: string
      - name: TemplateName
        in: query
        description: Search with template name.
        schema:
          type: string
      - name: Cancelled
        in: query
        schema:
          type: string
      - name: isTrialDraft
        in: query
        schema:
          type: boolean
      - name: includeDeprecated
        in: query
        description: To include deprecated firmware's ota updates
        schema:
          type: boolean
      - name: isEdge
        in: query
        description: 'IsEdge : Pass value as true to get only those ota updates which are associated with edge templates'
        schema:
          type: boolean
      - name: isGateway
        in: query
        description: 'IsGateway : Pass value as true to get only those ota updates which are associated with gateway templates'
        schema:
          type: boolean
      - name: isLowBandwidth
        in: query
        description: 'IsLowBandwidth : Pass value as true to get only those ota updates which are associated with lowbandwidth templates'
        schema:
          type: boolean
      - name: isSphere
        in: query
        description: 'IsSphere : Pass value as true to get only sphere ota updates'
        schema:
          type: boolean
      - name: isOTASchedule
        in: query
        schema:
          type: boolean
      - name: firmwareUpgradeGuid
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that OTA update list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTAUpdateListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2OtaUpdate
      x-operation-id-source: derived
  /api/v2/ota-update/{otaUpdateGuid}:
    get:
      tags:
      - OTA
      summary: Get device list for OTA update
      description: 'This API endpoint provides you the list of devices, which are going to receive OTA updates. For that, you need to send otaUpdateGuid in request url.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: otaUpdateGuid
        in: path
        description: OTA update guid
        required: true
        schema:
          type: string
          format: uuid
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        description: Search with status, Eg. pending, success, failed, sent, skipped, executed etc.
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. entityName asc, entityName desc, entityName etc
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that device list for OTA update received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTAUpdateDetailResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2OtaUpdateByOtaUpdateGuid
      x-operation-id-source: derived
