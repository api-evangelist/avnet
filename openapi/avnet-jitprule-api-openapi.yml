          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitpRuleRegexDeleteResponse'
        '409':
          description: Indicates that the request could not be carried out because of one of the below or other conflicts on the server.
      operationId: deleteApiV21JitpRuleByJitpRuleGuidByJitpRuleRegexGuid
      x-operation-id-source: derived
