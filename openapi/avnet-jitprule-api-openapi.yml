        '200':
          description: Indicates that the regex type lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegexTypeLookupResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      operationId: getApiV21JitpRuleRegextypeLookup
      x-operation-id-source: derived
  /api/v2.1/JitpRule/{jitpRuleGuid}/{jitpRuleRegexGuid}:
    delete:
      tags:
      - JitpRule
      summary: Delete a jitp rule regex
      description: This API endpoint allows you to delete a jitp rule regex. For that, you need to send jitpRuleRegexGuid in request url.
      parameters:
      - name: jitpRuleGuid
        in: path
        description: Jitp Rule Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: jitpRuleRegexGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
