openapi: 3.2.0
info:
  title: /IOTCONNECT™ Device Jitp Rule API
  description: 'Device REST API contains information of Device modules.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.1'
security:
- Bearer: []
tags:
- name: JitpRule
  description: Jitp Rule Api List
paths:
  /api/v2.1/JitpRule:
    post:
      tags:
      - JitpRule
      summary: Add new jitp rule
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device is created successfully and returns created device guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitpRuleCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: Indicates that the request could not be carried out because of one of the below or other conflicts on the server.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitpRuleCreateRequest'
        description: Json object with jitp rule details.
      operationId: postApiV21JitpRule
      x-operation-id-source: derived
    get:
      tags:
      - JitpRule
      summary: Get list of jitp rules
      description: 'This API endpoint provides you the list of available jitp rules


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the jitp rule list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitpRuleListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: Indicates that the request could not be carried out because of one of the below or other conflicts on the server.
      operationId: getApiV21JitpRule
      x-operation-id-source: derived
  /api/v2.1/JitpRule/{jitpRuleGuid}:
    get:
      tags:
      - JitpRule
      summary: Get all the details of jitp rule
      description: Getting all the details of a jitp rule
      parameters:
      - name: jitpRuleGuid
        in: path
        description: Jitp Rule Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the jitp rule information received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitpRuleDetailResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: Indicates that the request could not be carried out because of one of the below or other conflicts on the server.
      operationId: getApiV21JitpRuleByJitpRuleGuid
      x-operation-id-source: derived
    delete:
      tags:
      - JitpRule
      summary: Delete a jitp rule
      description: This API endpoint allows you to delete a jitp rule. For that, you need to send jitpRuleGuid in request url.
      parameters:
      - name: jitpRuleGuid
        in: path
        description: Jitp Rule Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that jitp rule deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitpRuleDeleteResponse'
        '409':
          description: Indicates that the request could not be carried out because of one of the below or other conflicts on the server.
      operationId: deleteApiV21JitpRuleByJitpRuleGuid
      x-operation-id-source: derived
  /api/v2.1/JitpRule/{jitpRuleguid}/update-rule-sequence:
    put:
      tags:
      - JitpRule
      summary: Update jitp rule sequence
      description: This API endpoint lets you update jitp rule sequence.
      parameters:
      - name: jitpRuleguid
        in: path
        description: Jitp Rule Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that jitp rule sequence updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '204':
          description: Indicates that jitp rule doesn't exist or jitp rule sequence already updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\n            invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitpRuleUpdateSequenceRequest'
        description: Json object
      operationId: putApiV21JitpRuleByJitpRuleguidUpdateRuleSequence
      x-operation-id-source: derived
  /api/v2.1/JitpRule/{jitpRuleRegexguid}/update-rule-regex-sequence:
    put:
      tags:
      - JitpRule
      summary: Update jitp rule regex sequence
      description: This API endpoint lets you update jitp rule regex sequence.
      parameters:
      - name: jitpRuleRegexguid
        in: path
        description: Jitp Rule Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that jitp rule regex sequence updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '204':
          description: Indicates that jitp rule regex doesn't exist or jitp rule regex sequence already updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\n            invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JitpRuleRegexUpdateSequenceRequest'
        description: Json object
      operationId: putApiV21JitpRuleByJitpRuleRegexguidUpdateRuleRegexSequence
      x-operation-id-source: derived
  /api/v2.1/JitpRule/regextype-lookup:
    get:
      tags:
      - JitpRule
      summary: Get RegexType lookup
      description: This API endpoint provides you the lookup of all available regex types.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
