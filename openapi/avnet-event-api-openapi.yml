  /api/v2.1/Event:
    get:
      tags:
      - Event
      summary: Get predefined event list
      description: 'This API endpoint provides you the list of predefined event subscriptions. Using these details, company users can subscribe to these events later.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string. eventTopicGuid parameter is used to get the list of event subscriptions for a given event topic group.'
