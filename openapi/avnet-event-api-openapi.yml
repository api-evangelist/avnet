openapi: 3.2.0
info:
  title: Avnet Event API
  version: '1.0'
  description: 'Operations tagged Event across 2 of this provider''s published API definitions: avnet-iotconnect-event-aws-prod-swagger.json, avnet-iotconnect-event-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Event
  description: Event Api List
paths:
  /api/v2.1/Event/subscription/subscribe:
    post:
      tags:
      - Event
      summary: Subscribe to an event
      description: 'Events play a crucial role in supervising users and devices (onshore or offshore) 24X7. These events can range from technical occurrences like creating a device, acquiring a device to changing an attribute by a user in a specific template. To notify users about any such events, a user needs to subscribe.


        Subscribe for events using this API endpoint.


        1.eventGuid 2.eventName 3.using both Let’s suppose, when the user employs both request parameters and out of it eventGuid is not correct.Even in that scene, eventGuid will be given priority and get validation. Here, deliveryMethod defines how you would like to notify a user, either by email, SMS, or push. If you provide role guid in roleGuid parameter, it will notify the users of that role. You can also give a list of user’s guid to notify users contained in a list.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the event subscribed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nEvent not found, delivery method not found, delivery method not active, event subscription already exists, severity level not exists \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscriptionCreateRequest'
        description: Json object. eventGuid is required
      operationId: postApiV21EventSubscriptionSubscribe
      x-operation-id-source: derived
  /api/v2.1/Event/subscription/{subscriptionGuid}:
    put:
      tags:
      - Event
      summary: Update event subscription details
      description: This API endpoint allows you to update event subscription details. For that, you need to send subscriptionGuid in request url and updated event subscription details in the request body.
      parameters:
      - name: subscriptionGuid
        in: path
        description: Event Subscription Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the event subscription updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionUpdateResponse'
        '204':
          description: Indicates that RefData is null or RoleGuids or UserGuids not found in RefData.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nDelivery method not found, delivery method not active, event subscription not exists, severity level not exists \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscriptionUpdateRequest'
        description: Json object
      operationId: putApiV21EventSubscriptionBySubscriptionGuid
      x-operation-id-source: derived
    get:
      tags:
      - Event
      summary: Get details of single subscription
      description: This API endpoint gives you a detailed description of the subscribed event subscription. For that, you need to send subscriptionGuid in request url.
      parameters:
      - name: subscriptionGuid
        in: path
        description: Event Subscription Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the event subscription received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSubscriptionDetailResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Event subscription not found and invalid logged user or company.'
      operationId: getApiV21EventSubscriptionBySubscriptionGuid
      x-operation-id-source: derived
  /api/v2.1/Event/subscription/{subscriptionGuid}/un-subscribe:
    delete:
      tags:
      - Event
      summary: Delete event subscription
      description: This API endpoint allows you to unsubscribe an event subscription. For that, you need to send event subscriptionGuid in request url.
      parameters:
      - name: subscriptionGuid
        in: path
        description: Event Subscription Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
