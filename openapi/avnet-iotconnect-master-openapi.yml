    delete:
      tags:
      - Property
      summary: Delete a property
      description: <p>This API endpoint allows you to delete a custom property. For that, you need to send <i>propertyTypeGuid</i>
        and <i>propertyGuid</i> in request url.</p>
      parameters:
      - name: propertyTypeId
        in: path
        description: Property Type Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: propertyId
        in: path
        description: Property Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that property is deleted successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyDeleteResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server\r\nProperty doesn't exist, Company doesn't exist, User is not valid etc."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
    get:
      tags:
      - Property
      summary: Get single property description
      description: <p>This API endpoint gives you a detailed description of a property. For that, you need to send <i>propertyTypeGuid</i>
        and <i>propertyGuid</i> in request url.</p>
      parameters:
      - name: propertyTypeId
        in: path
        description: Property Type Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: propertyId
        in: path
        description: Property Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that property detail is loaded successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server\r\nProperty doesn't exist, Company doesn't exist, Logged in user is invalid etc."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
  /api/v2/Property/custom-field-type:
    get:
      tags:
      - Property
      summary: Get field type list
      description: <p>This API endpoint gives you the list of valid field types. These field types are used to decide which
        HTML input control needs to be used for this property in UI. Examples of field types are Text, TextArea.</p>
      responses:
        '200':
          description: Indicates that field type list is loaded successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FieldTypeListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
