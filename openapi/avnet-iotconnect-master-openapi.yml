paths:
  /api/v2/Faq:
    get:
      tags:
      - Faq
      summary: Get FAQ list
      description: "<p>This API endpoint provides you the list of available FAQs.</p>\r\n<p>You can also add the filters as\
        \ given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters\
        \ in a query string.</p>"
      parameters:
      - name: pageNumber
        in: query
        description: Page Number
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Page Size
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: Search Text
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort by name and order/ex:name asc
        schema:
          type: string
      responses:
        '200':
          description: Indicates that FAQ list is loaded successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FaqListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server\r\nCompany doesn't exist, Logged in user is invalid etc."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    post:
      tags:
      - Faq
      summary: Add new FAQ
      description: <p>Add new frequently asked questions using this API endpoint. For that, you need to send questions and
        answers in the request body.</p>
      responses:
        '200':
          description: Indicates that FAQ is created successfully and returns created FAQ id.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FaqCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server\r\nCompany doesn't exist, User is not valid etc."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaqCreateRequest'
        description: Json object
