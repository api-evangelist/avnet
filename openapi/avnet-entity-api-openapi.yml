          format: uuid
      - name: propertyGuid
        in: path
        description: Guid of property which needs to be deleted from entity
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
