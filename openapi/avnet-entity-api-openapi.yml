  /api/v2.1/Entity/{entityGuid}/property/{propertyGuid}:
    delete:
      tags:
      - Entity
      summary: Delete custom property value
      description: This API endpoint allows you to delete a custom property value for an entity. For that, you need to send entityGuid and customPropertyGuid in request url.
      parameters:
      - name: entityGuid
        in: path
        description: Guid of Entity which needs to be updated
        required: true
