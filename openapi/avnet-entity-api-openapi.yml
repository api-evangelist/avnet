          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityBulkImportListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21EntityBulkImportHistory
      x-operation-id-source: derived
  /api/v2.1/Entity/bulk-import/{parentEntityGuid}/validate:
    post:
      tags:
      - Entity
      summary: Validate entities in batch
      description: This API endpoint helps to validate entities along with users in bulk for the given parent entity guid. For that, upload a JSON file in the file parameter, containing list of entities and an optional respective user for respective entity along with children entities that you want to create under a given parent entity.
      parameters:
      - name: parentEntityGuid
        in: path
        description: A valid entity guid of parent
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the external device process validated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityBulkImportValidateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Entity doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      operationId: postApiV21EntityBulkImportByParentEntityGuidValidate
      x-operation-id-source: derived
  /api/v2.1/Entity/bulk-import/{bulkImportGuid}/file:
    get:
      tags:
      - Entity
      summary: Get bulk entity import file content
      parameters:
      - name: bulkImportGuid
        in: path
        description: Bulk import guid
        required: true
        schema:
          type: string
          format: uuid
      - name: isSuccess
        in: query
        description: 'Nullable, if not passed. It will download user uploaded content. if true: it will download success data. if false: it will download failed entity data'
        schema:
          type: boolean
      responses:
        '401':
