openapi: 3.2.0
info:
  title: Avnet Entity API
  version: '1.0'
  description: 'Operations tagged Entity across 2 of this provider''s published API definitions: avnet-iotconnect-user-aws-prod-swagger.json, avnet-iotconnect-user-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Entity
  description: Entity Api List
paths:
  /api/v2.1/Entity:
    post:
      tags:
      - Entity
      summary: Add new entity
      description: 'An entity in IoTConnect is the company/location-based hierarchy where users can manage different entities/companies under which several devices and users can be managed. The entity facilitates a user to control multiple sub-companies under a parent company. When you create a company, an entity gets created automatically, which is considered as a parent entity of your company.


        This API endpoint allows you to add new entities for your company. Such new entities get their place under a parent entity. Here name, parentEntityGuid, address, city, countryGuid, stateGuid are mandatory. If you opt to create an entity owner, firstName, lastName, userId, roleGuid, timeZoneGuid are mandatory.'
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that entity is created successfully and returns created entity guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCreateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreateV2Request'
        description: Json object
      operationId: postApiV21Entity
      x-operation-id-source: derived
    get:
      tags:
      - Entity
      summary: Get entity list
      description: Get a list of available entities of your company using this API endpoint.
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that entity list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityListResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      operationId: getApiV21Entity
      x-operation-id-source: derived
  /api/v2.1/Entity/{entityGuid}:
    put:
      tags:
      - Entity
      summary: Update an entity
      description: 'To update entity name, location details, or a parent-child architecture relationship, use this API endpoint. You need to send entityGuid in request url and updated entity details in the request body.


        Here, you even have an option to set an existing user as the owner of the entity. For that, you need to send a user guid in ownerUserGuid parameter. To arrange a new user as an entity owner, you need to send user details in the userInfo parameter.'
      parameters:
      - name: entityGuid
        in: path
        description: Guid of Entity which needs to be updated
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that entity is updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityUpdateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdateRequest'
        description: Json object
      operationId: putApiV21EntityByEntityGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Entity
      summary: Delete an entity
      description: This API endpoint allows you to delete an entity. For that, you need to send entityGuid in request url.
      parameters:
      - name: entityGuid
        in: path
        description: Guid of Entity which needs to be deleted
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that entity is deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      operationId: deleteApiV21EntityByEntityGuid
      x-operation-id-source: derived
    get:
      tags:
      - Entity
      summary: Get single entity detail
      description: This API endpoint gives you a detailed description of any entity of your company. For that, you need to send entityGuid in request url.
      parameters:
      - name: entityGuid
        in: path
        description: Entity Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that entity details are loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityDetailResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      operationId: getApiV21EntityByEntityGuid
      x-operation-id-source: derived
  /api/v2.1/Entity/lookup:
    get:
      tags:
      - Entity
      summary: Get entity lookup list
      description: This API endpoint allows you to get the lookup list of available entities in your company.
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
