  /api/v2.1/Entity/bulk-import/history:
    get:
      tags:
      - Entity
      summary: Get entity bulk import list
      description: This API endpoint provides you the list of all imported entities in bulk. This will give you the current status of all batch import along with the count of entities with validation status as success and failure.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. createdDate desc, createdDate asc, createdDate, entityName
        schema:
          type: string
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
