  /api/v2/Telemetry/device/{uniqueId}/recent/{dataPoints}:
    post:
      tags:
      - Telemetry
      summary: Get recent data of device's attributes
      description: <p>This API endpoint gives you the recent N dataPoints data for a device. For that, you need to send device's
        unique id in <i>uniqueId</i> parameter along with number of dataPoints in <i>dataPoints</i> parameter request body.</p>
      parameters:
      - name: uniqueId
        in: path
        description: Device Unique Id
        required: true
        schema:
          type: string
      - name: dataPoints
        in: path
        description: <i>dataPoints</i> should be numeric and should be in range of 10 to 500
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAttrRecentRequest'
        description: <i>request</i> Json request containing childs'id and filter attributes
      responses:
