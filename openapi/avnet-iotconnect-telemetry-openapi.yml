        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Telemetry/attribute-history/attribute/{attributeGuid}/device/{uniqueId}/from/{fromDate}/to/{toDate}:
    get:
      tags:
      - Telemetry
      summary: Get telemetry historical data for single attribute
      description: <p>This API endpoint lets you access the historical data for your device sensors. For that, you need to
        send device unique id in <i>uniqueId</i> parameter and attribute/sensor name in <i>attributeGuid</i> parameter along
        with the fromDate and toDate.</p>
      parameters:
      - name: attributeGuid
        in: path
        description: Enter Attribute Name
        required: true
        schema:
          type: string
      - name: uniqueId
        in: path
        description: Device Unique Id
        required: true
        schema:
          type: string
      - name: fromDate
        in: path
        description: From date should be UTC and format should be YYYY-MM-DD or YYYY-MM-DD HH:mm:ss
        required: true
        schema:
          type: string
      - name: toDate
        in: path
        description: To date should be UTC and format should be YYYY-MM-DD or YYYY-MM-DD HH:mm:ss
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the telemetry historical data received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttributeHistoryResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nInvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Telemetry/attribute-history/device/{uniqueId}/from/{fromDate}/to/{toDate}:
    get:
      tags:
      - Telemetry
      summary: Get telemetry historical data for all attributes
      description: <p>This API endpoint gives you the historical data for all device sensors. For that, you need to send device
        unique id in <i>uniqueId</i> parameter along with fromDate and toDate.</p>
      parameters:
      - name: uniqueId
        in: path
        description: Device Unique Id
        required: true
        schema:
          type: string
      - name: fromDate
        in: path
        description: From date should be UTC and format should be YYYY-MM-DD or YYYY-MM-DD HH:mm:ss
        required: true
        schema:
          type: string
      - name: toDate
        in: path
        description: To date should be UTC and format should be YYYY-MM-DD or YYYY-MM-DD HH:mm:ss
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the telemetry historical data received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttributeDeviceHistoryResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
