openapi: 3.0.0
info:
  title: /IOTCONNECT™ Telemetry API
  description: Telementry REST API contains information of Telemetry modules. Its main REST API Device-Cloud and Cloud-Device
    communication through HTTP(S) and MQTT protocols.
  version: '2.0'
  x-source: https://telemetry.iotconnect.io/api/v2/swagger-json
  x-harvested: '2026-09-18'
  x-original: openapi/_original/avnet-iotconnect-telemetry-azure-prod-swagger.json
  x-conversion: Swagger 2.0 -> OpenAPI 3.0.0 via swagger2openapi; operations, parameters, schemas and responses are as published
    — only servers[] and these x- provenance keys were added. No operationIds are published by the provider and none were
    invented.
  x-ownership: IoTConnect is Avnet's own IoT platform (docs.iotconnect.io is titled "Avnet /IOTCONNECT", carries "Copyright
    Avnet, Inc." and links github.com/avnet-iotconnect); the product lives on iotconnect.io rather than avnet.com.
servers:
- url: https://telemetry.iotconnect.io
  description: /IOTCONNECT production (Azure platform) — the host the docs page resolves for env=prod&pf=az; paths carry the
    /api/v2 prefix
paths:
  /api/v2/Telemetry/device/{deviceGuid}:
    get:
      tags:
      - Telemetry
      summary: Get device sensor list
      description: <p>This API endpoint gives you the list of sensors/attributes associated with a device. For that, you need
        to send <i>deviceGuid</i> in request url. In response, attributeValue shows the latest sensor value received from
        a device.</p>
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that the device sensor detail list received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeviceSensorDetailResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nThe device not found and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Telemetry/stomp-reader:
    get:
      tags:
      - Telemetry
      summary: Get stomp reader information
      description: <p>This API endpoint provides you the information of stomp reader or an UI alert. For that, you need to
        send a stomp or UI alert in the query string parameter <i>type</i>.</p>
      parameters:
      - name: type
        in: query
        description: type should be 'stomp','ui-alert' or 'signalr', default value is 'stomp'
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the stomp reader information received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StompReaderResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nInvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Telemetry/mqtt-reader:
    get:
      tags:
      - Telemetry
      summary: Get mqtt reader information
      description: <p>This API endpoint gives you the information of the MQTT reader.</p>
      responses:
        '200':
          description: Indicates that the mqtt reader information received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MqttReaderResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
