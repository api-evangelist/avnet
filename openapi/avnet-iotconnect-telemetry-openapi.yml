        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Telemetry/template:
    post:
      tags:
      - Telemetry
      summary: Get template data
      description: "<p>This API endpoint provides you the list of devices associated with provided templates.</p>\r\n<p>Here,\
        \ you can send multiple templates under the <i>template</i> parameter. It gives you the list of all template devices.\
        \ If you send attribute guid in <i>attributes</i> parameter, it provides you data for those attributes only for all\
        \ template devices. Otherwise, it gives you all the attributes.</p>"
      responses:
        '200':
          description: Indicates that template data received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeviceDetailByTemplateResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nInvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceDetailsByTemplateRequest'
        description: Json object
