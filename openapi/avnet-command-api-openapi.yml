openapi: 3.2.0
info:
  title: Avnet Command API
  version: '1.0'
  description: 'Operations tagged Command across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Command
  description: Command Api List
paths:
  /api/v2.1/template-command:
    post:
      tags:
      - Command
      summary: Add new template command
      description: 'Commands are used to manage a device remotely. You can add multiple commands to your device template. You can use commands to run a command on the device remotely, instantly, from IoTConnect.


        This API endpoint allows you to create device template commands. These commands will be defined in your device template and will be a part of your device template. A template can have one or more commands.


        Here, name and command are mandatory for any template command.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that template command created successfully and returns created template command guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist, command already exists, tag is required for gateway template, invalid tag and invalid logged user or company'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandCreateRequest'
        description: Json object
      operationId: postApiV21TemplateCommand
      x-operation-id-source: derived
  /api/v2.1/template-command/{commandGuid}:
    put:
      tags:
      - Command
      summary: Update template command
      description: This API endpoint lets you update a command. For that, you need to send commandGuid in request url and command update details in the request body.
      parameters:
      - name: commandGuid
        in: path
        description: Template Command Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that template command updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandUpdateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist, command not found, command already exists, tag is required for gateway template, invalid tag and invalid logged user or company'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandUpdateRequest'
        description: Json object
      operationId: putApiV21TemplateCommandByCommandGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Command
      summary: Delete a command
      description: This API endpoint allows you to delete a command. For that, you need to send commandGuid in request url.
      parameters:
      - name: commandGuid
        in: path
        description: Template Command Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that template command deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandDeleteResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist, command not found and invalid logged user or company'
      operationId: deleteApiV21TemplateCommandByCommandGuid
      x-operation-id-source: derived
  /api/v2.1/template-command/{deviceTemplateGuid}:
    get:
      tags:
      - Command
      summary: Get device template command list
      description: 'This API endpoint gives you the list of available commands in your device template. For that, you need to send deviceTemplateGuid in request url.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: deviceTemplateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: 'To sort the list. To do that, Specify Field name to sort with and sorting order. Eg: name asc, name desc, name'
        schema:
          type: string
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that template command list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist and invalid logged user or company'
      operationId: getApiV21TemplateCommandByDeviceTemplateGuid
      x-operation-id-source: derived
  /api/v2.1/template-command/{deviceTemplateGuid}/lookup:
    get:
      tags:
      - Command
      summary: Get device template command lookup
      description: This API endpoint provides you the lookup list of available commands in your device template. For that, you need to send deviceTemplateGuid in request url.
      parameters:
      - name: deviceTemplateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: tag
        in: query
        description: Tag
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that template command lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandLookupResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist and invalid logged user or company'
      operationId: getApiV21TemplateCommandByDeviceTemplateGuidLookup
      x-operation-id-source: derived
  /api/v2.1/template-command/device/{deviceGuid}/send:
    post:
      tags:
      - Command
      summary: Execute a command on device
      description: Run a command on any device using this API endpoint. For that, you need to send deviceGuid in request url along with commandGuid and parameterValue in the request body. This command will be executed on a real device. Using this, you will be able to send data to devices from your UI.
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the command sent to device successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandSendToDeviceResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device doesn''t exist, not allowed to send the device command as the device is shared device with read permission only,

            command doesn''t exist and invalid logged user or company'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandSendToDeviceRequest'
        description: Json object
      operationId: postApiV21TemplateCommandDeviceByDeviceGuidSend
      x-operation-id-source: derived
  /api/v2.1/template-command/send:
    post:
      tags:
      - Command
      summary: Execute a command on multiple devices
      description: 'Run a command on multiple devices using this API endpoint. For that, you need to send either entityGuid or deviceGuid list along with commandGuid and parameterValue in the request body.


        If you wish to send entityGuid, send value “1” in the applyTo parameter and entity guid in entityGuid parameter. This will send commands to all the devices available in the given entity. You can also send these commands to child devices of a given entity. For that, you need to send value “true” in isRecursive parameter.


        If you wish to send deviceGuid list, send value “2” in the applyTo parameter and list of device guids in devices parameter. This will send commands to selected devices only.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
