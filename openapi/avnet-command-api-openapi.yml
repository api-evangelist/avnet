          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandSendResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device doesn''t exist and invalid logged user or company'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandSendRequest'
        description: Json object
      operationId: postApiV21TemplateCommandSend
      x-operation-id-source: derived
  /api/v2.1/device-command/{uniqueId}/send:
    post:
      tags:
      - Command
      summary: Execute a command on device using device uniqueId
      description: Run a command on any device using this API endpoint. For that, you need to send deviceUniqueId and command along with companyGuid in the request body. This command will be executed on a real device. Using this, you will be able to send data to devices from your UI.
