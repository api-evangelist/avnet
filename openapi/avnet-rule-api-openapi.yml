openapi: 3.2.0
info:
  title: Avnet Rule API
  version: '1.0'
  description: 'Operations tagged Rule across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Rule
  description: Rule Api List
paths:
  /api/v2.1/Rule:
    post:
      tags:
      - Rule
      summary: Add new rule
      description: 'Rules enable you to monitor your devices in near real-time and automatically invoke actions, such as send emails, show UI notifications, etc. whenever the rule is matched. In a rule, you can define the condition for which you wish to monitor your device and configure the corresponding actions. Rule triggers when the selected device telemetry crosses a specified threshold mentioned in the condition.


        This API endpoint allows you to create rules. Here name, templateGuid, severityLevelGuid, ruleType and applyTo are mandatory for any template rule. conditionText needs a condition on attribute values. If the condition is true, it is considered as the rule matched.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that rule created successfully and returns created rule guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist, rule name already exist, invalid applyTo for edge template, ruleType must be 1 for edge template,

            entity doesn''t exist, role doesn''t exist, user doesn''t exist, device doesn''t exist, severity level doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreateRequest'
        description: Json object
      operationId: postApiV21Rule
      x-operation-id-source: derived
    get:
      tags:
      - Rule
      summary: Get device certificates list
      description: Get an entire list of device certificates using this API endpoint. You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name ,status
        schema:
          type: string
      - name: isEdge
        in: query
        description: 'IsEdge : Pass value as true to get only those rules which associated with edge template'
        schema:
          type: boolean
      - name: isGateway
        in: query
        description: 'IsGateway : Pass value as true to get only those rules which associated with gateway template'
        schema:
          type: boolean
      - name: name
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: templateName
        in: query
        schema:
          type: string
      - name: entityName
        in: query
        schema:
          type: string
      - name: ruleType
        in: query
        schema:
          type: string
      - name: isLowBandwidth
        in: query
        description: 'IsLowBandwidth : Pass value as true to get only those rules which associated with low bandwidth template'
        schema:
          type: boolean
      - name: greenGrass
        in: query
        description: 'GreenGrass : Pass value as true to get only greengrass device rules'
        schema:
          type: boolean
      - name: wireless
        in: query
        description: 'Wireless : Pass value as true to get only wireless device rules'
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
