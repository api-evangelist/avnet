openapi: 3.2.0
info:
  title: /IOTCONNECT™ Device Deployment API
  description: 'Device REST API contains information of Device modules.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: Deployment
  description: Deployment API List
paths:
  /api/v2/deployments:
    get:
      tags:
      - Deployment
      summary: Get Deployment list
      description: This API endpoint provides you the get list of device update deployments.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the deployment list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      operationId: getApiV2Deployments
      x-operation-id-source: derived
    post:
      tags:
      - Deployment
      summary: Create scheduled deployment for device update
      description: This API endpoint provides you to create deployment for IotHub Device.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the Deployment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreateRequest'
      operationId: postApiV2Deployments
      x-operation-id-source: derived
