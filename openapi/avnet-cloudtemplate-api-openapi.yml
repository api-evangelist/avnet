        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            the device doesn''t exist and invalid logged user or company.'
      operationId: getApiV21CloudTemplateDeviceByUniqueId
      x-operation-id-source: derived
  /api/v2.1/CloudTemplate/device/{deviceGuid}:
    delete:
      tags:
      - CloudTemplate
      summary: Delete a device
      description: To delete a device, use this API endpoint. To do that, you need to send a deviceGuid in request url that you want to delete. This will also release your device from Azure IoT Hub, even if the device is acquired.
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
