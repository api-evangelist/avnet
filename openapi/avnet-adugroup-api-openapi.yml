openapi: 3.2.0
info:
  title: /IOTCONNECT™ Device ADU Group API
  description: 'Device REST API contains information of Device modules.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: ADUGroup
  description: ADU Groups API List
paths:
  /api/v2/adu-groups:
    get:
      tags:
      - ADUGroup
      summary: Get ADU Group list
      description: This API endpoint provides you the get list of ADU Groups.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. name desc, name asc, name.
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the ADU Group list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADUGroupsListResponse'
        '204':
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      operationId: getApiV2AduGroups
      x-operation-id-source: derived
    post:
      tags:
      - ADUGroup
      summary: Create ADU Group
      description: This API endpoint provides you to create ADU Group.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the ADU Group created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ADUGroupCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ADUGroupCreateRequest'
      operationId: postApiV2AduGroups
      x-operation-id-source: derived
