        '200':
          description: Indicates that connection verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionVerifyRespoonse'
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionVerifyRequest'
      operationId: postApiV21MasterConnectionverify
      x-operation-id-source: derived
  /api/v2.1/Master/ui-mqtt:
    get:
      tags:
      - Master
      summary: Get ui-alert or notification configuration information
      description: This API endpoint provides you the information of notification or an ui-alert. For that, you need to send a notification or UI alert in the query string parameter type.
      parameters:
      - name: type
