openapi: 3.2.0
info:
  title: Avnet Master API
  version: '1.0'
  description: 'Operations tagged Master across 2 of this provider''s published API definitions: avnet-iotconnect-master-aws-prod-swagger.json, avnet-iotconnect-master-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Master
  description: Master Api List
paths:
  /api/v2.1/Master/country:
    get:
      tags:
      - Master
      summary: Get country list
      description: This API endpoint provides you the list of all countries.
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that country list loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'
      operationId: getApiV21MasterCountry
      x-operation-id-source: derived
  /api/v2.1/Master/country/{countryGuid}/state:
    get:
      tags:
      - Master
      summary: Get country state list
      description: This API endpoint gives you the list of all states for a given country. For that, you need to send countryGuid in request url.
      parameters:
      - name: countryGuid
        in: path
        description: Country id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
