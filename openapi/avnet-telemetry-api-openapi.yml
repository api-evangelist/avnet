openapi: 3.2.0
info:
  title: Avnet Telemetry API
  x-refined-note:
  - x-conversion differs across the merged source definitions and was not carried
  - x-harvested differs across the merged source definitions and was not carried
  - x-original differs across the merged source definitions and was not carried
  - x-ownership differs across the merged source definitions and was not carried
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Telemetry across 4 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-telemetry-aws-prod-swagger.json, avnet-iotconnect-telemetry-azure-prod-swagger.json, avnet-iotconnect-telemetry-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://telemetry.iotconnect.io
  description: /IOTCONNECT production (Azure platform) — the host the docs page resolves for env=prod&pf=az; paths carry the /api/v2 prefix
security:
- Bearer: []
tags:
- name: Telemetry
  description: Telemetry Module Api List
paths:
  /api/v2.1/Telemetry/device/{deviceGuid}:
    get:
      tags:
      - Telemetry
      summary: Get device sensor list
      description: This API endpoint gives you the list of sensors/attributes associated with a device. For that, you need to send deviceGuid in request url. In response, attributeValue shows the latest sensor value received from a device.
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device sensor detail list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSensorDetailResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device not found and invalid logged user or company.'
      operationId: getApiV21TelemetryDeviceByDeviceGuid
      x-operation-id-source: derived
  /api/v2.1/Telemetry/stomp-reader:
    get:
      tags:
      - Telemetry
      summary: Get stomp reader information
      description: This API endpoint provides you the information of stomp reader or an UI alert. For that, you need to send a stomp or UI alert in the query string parameter type.
      parameters:
      - name: type
        in: query
        description: type should be 'stomp' or 'ui-alert' or 'signalr', default value is 'stomp'
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
