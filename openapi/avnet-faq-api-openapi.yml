                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that FAQ is created successfully and returns created FAQ id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqCreateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, User is not valid etc.'
