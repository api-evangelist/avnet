openapi: 3.2.0
info:
  title: Avnet Faq API
  version: '1.0'
  description: 'Operations tagged Faq across 2 of this provider''s published API definitions: avnet-iotconnect-master-aws-prod-swagger.json, avnet-iotconnect-master-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: FAQ
  description: FAQ Api List
paths:
  /api/v2.1/Faq:
    get:
      tags:
      - FAQ
      summary: Get FAQ list
      description: 'This API endpoint provides you the list of available FAQs.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: Page Number
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: Page Size
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: Search Text
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort by name and order/ex:name asc
        schema:
          type: string
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that FAQ list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is invalid etc.'
      operationId: getApiV21Faq
      x-operation-id-source: derived
    post:
      tags:
      - FAQ
      summary: Add new FAQ
      description: Add new frequently asked questions using this API endpoint. For that, you need to send questions and answers in the request body.
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
