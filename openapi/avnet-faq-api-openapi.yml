          application/json:
            schema:
              $ref: '#/components/schemas/FaqCreateRequest'
        description: Json object
      operationId: postApiV21Faq
      x-operation-id-source: derived
  /api/v2.1/Faq/{faqGuid}/sequence:
    put:
      tags:
      - FAQ
      summary: Update FAQ sequence
      description: Update the display sequence of a frequently asked question using this API endpoint. For that, you need to send faqGuid in request url along with a new display sequence in the request body.
