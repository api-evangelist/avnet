        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nEvent subscription not found, Event subscription can not be Unsubscribed for auto subscribed\
            \ event \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v1.1/Event/subscription:
    get:
      tags:
      - Event
      summary: Get subscribed event list
      description: "<p>This API endpoint provides you the list of subscribed events for your company.</p>\r\n<p>You can also\
        \ add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these\
        \ filter parameters in a query string. The <i>eventGuid</i> parameter is used to get the list of subscriptions for\
        \ the given event guid.</p>"
      parameters:
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort By, Eg. name asc, name desc, name etc.
        schema:
          type: string
      - name: eventguid
        in: query
        description: Get by eventGuid
        schema:
          type: string
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Indicates that the event subscription list received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSubscribedListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
