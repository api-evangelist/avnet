openapi: 3.0.0
info:
  title: /IOTCONNECT™ Event API
  description: Event REST API contains information of Event modules.
  version: '1.1'
  x-source: https://event.iotconnect.io/api/v1.1/swagger-json
  x-harvested: '2026-09-18'
  x-original: openapi/_original/avnet-iotconnect-event-azure-prod-swagger.json
  x-conversion: Swagger 2.0 -> OpenAPI 3.0.0 via swagger2openapi; operations, parameters, schemas and responses are as published
    — only servers[] and these x- provenance keys were added. No operationIds are published by the provider and none were
    invented.
  x-ownership: IoTConnect is Avnet's own IoT platform (docs.iotconnect.io is titled "Avnet /IOTCONNECT", carries "Copyright
    Avnet, Inc." and links github.com/avnet-iotconnect); the product lives on iotconnect.io rather than avnet.com.
servers:
- url: https://event.iotconnect.io
  description: /IOTCONNECT production (Azure platform) — the host the docs page resolves for env=prod&pf=az; paths carry the
    /api/v1.1 prefix
paths:
  /api/v1.1/Event/subscription/subscribe:
    post:
      tags:
      - Event
      summary: Subscribe to an event
      description: "<p>Events play a crucial role in supervising users and devices (onshore or offshore) 24X7. These events\
        \ can range from technical occurrences like creating a device, acquiring a device to changing an attribute by a user\
        \ in a specific template. To notify users about any such events, a user needs to subscribe.</p>\r\n<p>Subscribe for\
        \ events using this API endpoint. </p>\r\n<p>1.eventGuid 2.eventName 3.using both  Let’s suppose, when the user employs\
        \ both request parameters and out of it eventGuid is not correct.Even in that scene, eventGuid will be given priority\
        \ and get validation. Here, <i>deliveryMethod</i> defines how you would like to notify a user, either by email, SMS,\
        \ or push. If you provide role guid in <i>roleGuid</i> parameter, it will notify the users of that role. You can also\
        \ give a list of user’s guid to notify users contained in a list.</p>"
      responses:
        '200':
          description: Indicates that the event subscribed successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSubscriptionCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nEvent not found, delivery method not found, delivery method not active, event subscription\
            \ already exists, severity level not exists \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscriptionCreateRequest'
        description: Json object. eventGuid or eventName is required
  /api/v1.1/Event/subscription/{subscriptionGuid}:
    put:
      tags:
      - Event
      summary: Update event subscription details
      description: <p>This API endpoint allows you to update event subscription details. For that, you need to send <i>subscriptionGuid</i>
        in request url and updated event subscription details in the request body.</p>
      parameters:
      - name: subscriptionGuid
        in: path
        description: Event Subscription Guid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSubscriptionUpdateRequest'
        description: Json object
      responses:
        '200':
          description: Indicates that the event subscription updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSubscriptionUpdateResponse'
        '204':
          description: Indicates that RefData is null or RoleGuids or UserGuids not found in RefData.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nDelivery method not found, delivery method not active, event subscription not exists, severity\
            \ level not exists \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    get:
      tags:
      - Event
      summary: Get details of single subscription
      description: <p>This API endpoint gives you a detailed description of the subscribed event subscription. For that, you
        need to send <i>subscriptionGuid</i> in request url.</p>
      parameters:
      - name: subscriptionGuid
        in: path
        description: Event Subscription Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that the event subscription received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventSubscriptionDetailResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nEvent subscription not found and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v1.1/Event/subscription/{subscriptionGuid}/un-subscribe:
    delete:
      tags:
      - Event
      summary: Delete event subscription
      description: <p>This API endpoint allows you to unsubscribe an event subscription. For that, you need to send event
        <i>subscriptionGuid</i> in request url.</p>
      parameters:
      - name: subscriptionGuid
