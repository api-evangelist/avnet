  /api/v1.1/event-template:
    post:
      tags:
      - Event
      summary: Add event template
      description: "<p>To notify users, one needs predefined notification templates for email, SMS, or push.</p>\r\n<p>This\
        \ API endpoint allows you to create event notification templates.</p>\r\n<p>Here, <i>eventID</i> is a unique event\
        \ id. The <i>deliveryMethod</i> defines how you would like to notify a user, either by email, SMS, or push.</p>"
      responses:
        '200':
          description: Indicates that the event template created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTemplateCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
