  /api/v1.1/Event/subscriptions/{eventSubscriptionGuid}/template:
    post:
      tags:
      - Event
      summary: Add event template
      description: "<p>To notify users, one needs predefined notification templates for email, SMS, or push.</p>\r\n<p>This\
        \ API endpoint allows you to create event notification templates.</p>\r\n<p>Here, <i>eventID</i> is a unique event\
        \ id. The <i>deliveryMethod</i> defines how you would like to notify a user, either by email, SMS, or push.</p>"
      parameters:
      - name: eventSubscriptionGuid
        in: path
        description: eventSubscriptionGuid object
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/EventTemplateCreateRequest'
      responses:
        '200':
          description: Indicates that the event template created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventTemplateCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nEvent not found, event is not subscribed, delivery method not active, delivery method not\
            \ found, event template already exists \r\ndelivery method not subscribed and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v1.1/Event/subscriptions/{eventSubscriptionGuid}/template/eventId/{eventId}/delivery-method/{deliveryMethod}:
    get:
      tags:
      - Event
      summary: Get event template by eventId and deliveryMethod
      description: <p>This API endpoint gives you the event notification template details. For that, you need to send the
        <i>eventId</i> and delivery method in request url.</p>
      parameters:
      - name: eventSubscriptionGuid
