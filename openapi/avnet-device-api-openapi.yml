openapi: 3.2.0
info:
  title: Avnet Device API
  version: '1.0'
  description: 'Operations tagged Device across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Device
  description: Device Api List
paths:
  /api/v2.1/Device:
    post:
      tags:
      - Device
      summary: Add new device
      description: 'IoT device is a smart device that supports internet connectivity. Through connectivity, established using IoT communication protocols, these devices can interact with other devices. Not only that, it grants remote access to a user for managing the device as per their needs. These devices can be anything from consumer devices, wearables, home appliances, industrial monitoring systems to security systems.


        Add any quantity and a variety of devices using this API endpoint for easy integration with IoTConnect. The approach requires a device template, defining the features and type of your devices. Features include attributes, settings, properties, rules, commands and so on, by applying them on devices, users can monitor and manage.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device is created successfully and returns created device guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nThe device template doesn't exist, entity doesn't exist, the device is already exists, invalid tag, \nno attributes found in device template, parent device doesn't exist, parent and child device tags are same \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
        description: Json object with device details.
      operationId: postApiV21Device
      x-operation-id-source: derived
    get:
      tags:
      - Device
      summary: Get Device List
      description: 'This API endpoint gives you the list of available devices in your company.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order, Eg. uniqueId asc, uniqueId desc etc.
        schema:
          type: string
      - name: UniqueId
        in: query
        description: The unique id of device
        schema:
          type: string
      - name: Name
        in: query
        description: The display name of device
        schema:
          type: string
      - name: TemplateName
        in: query
        description: The device template name
        schema:
          type: string
      - name: EntityName
        in: query
        description: The entity name
        schema:
          type: string
      - name: Status
        in: query
        description: The status of device, Eg. active or inactive
        schema:
          type: string
      - name: Property
        in: query
        description: The custom property name of device
        schema:
          type: string
      - name: Value
        in: query
        description: The custom property value of device
        schema:
          type: string
      - name: Acquired
        in: query
        description: The device acquire status, Eg. acquired, released or inprogress
        schema:
          type: string
      - name: TemplateGuid
        in: query
        schema:
          type: string
      - name: EntityGuid
        in: query
        schema:
          type: string
      - name: IncludeRecentValue
        in: query
        schema:
          type: boolean
      - name: customField
        in: query
        description: Include custom fields info, 'true' to include custom poperties of devices and 'false' to exclude
        schema:
          type: boolean
      - name: isEdge
        in: query
        description: 'IsEdge : Pass value as true to get only edge devices'
        schema:
          type: boolean
      - name: isGateway
        in: query
        description: 'IsGateway : Pass value as true to get only gateway devices'
        schema:
          type: boolean
      - name: isLowBandwidth
        in: query
        description: 'IsLowBandwidth : Pass value as true to get only low badnwidth devices'
        schema:
          type: boolean
      - name: greenGrass
        in: query
        description: 'GreenGrass : Pass value as true to get only greengrass devices'
        schema:
          type: boolean
      - name: wireless
        in: query
        description: 'Wireless : Pass value as true to get only wireless devices'
        schema:
          type: boolean
      - name: certificateGuid
        in: query
        description: Certificate Guid to filter devices by certificate
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21Device
      x-operation-id-source: derived
  /api/v2.1/Device/{deviceGuid}:
    put:
      tags:
      - Device
      summary: Update a device
      description: Device details need to be updated anytime. Use this API endpoint to update your device details. Nevertheless, you can only update the display name, properties, notes and entity of a device. To update device details, you need to send deviceGuid in request url.
      parameters:
      - name: deviceGuid
        in: path
        description: The guid of the device.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device is updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device doesn''t exist, the device is shared device, the entity doesn''t exist, the child device entity can not update

            and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
        description: Json object with device update details.
      operationId: putApiV21DeviceByDeviceGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Device
      summary: Delete a device
      description: To delete a device, use this API endpoint. To do that, you need to send a deviceGuid in request url that you want to delete. This will also release your device from Azure IoT Hub, even if the device is acquired.
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDeleteResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            the device doesn''t exist, the device is shared device, an error occurred during delete a device from iothub

            and invalid logged user or company.'
      operationId: deleteApiV21DeviceByDeviceGuid
      x-operation-id-source: derived
  /api/v2.1/Device/{uniqueId}/acquire:
    put:
      tags:
      - Device
      summary: Acquire device broker info from cloud
      description: 'In simple words, acquire a device means registering your device on Azure IoT Hub. When you add a device, it adds in IoTConnect only. However, to transmit data from one device to the other, you need to register a device with Azure IoT Hub.


        To acquire your device, use this API endpoint. To do that, send device uniqueID in request url.'
      parameters:
      - name: uniqueId
        in: path
        description: The unique id of device
        required: true
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device acquired successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nthe device doesn't exist, the device template auth type is TPM, the device is not active, the device is already acquired, the device acquires process already started,  \nthe child device cannot be acquired, message or device quota are exceeded, an error occurred during acquire the device on iothub and invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAcquireRequest'
        description: Json object
      operationId: putApiV21DeviceByUniqueIdAcquire
      x-operation-id-source: derived
  /api/v2.1/Device/{uniqueId}/release:
    put:
      tags:
      - Device
      summary: Release device from cloud
      description: This API endpoint is used to release or remove your IoT device from Azure IoT Hub. For that, you need to send device Unique ID in request url.
      parameters:
      - name: uniqueId
        in: path
        description: The unique id of device
        required: true
        schema:
          type: string
      - name: isCloudDevice
        in: query
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device released successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nThe device doesn't exist, the device is not active, the device is already released, the device is shared device, \nan error occurred during release the device on iothub and invalid logged user or company."
      operationId: putApiV21DeviceByUniqueIdRelease
      x-operation-id-source: derived
  /api/v2.1/Device/{deviceGuid}/status:
    put:
      tags:
      - Device
      summary: Update device status
      description: This API endpoint allows you to change the status of your device. For that, you need to send deviceGuid in request url and isActive in the request body. In isActive, send true to activate your device and false to deactivate your device. When you deactivate your device, this will also release your device from Azure IoT Hub, even if the device is acquired.
      parameters:
      - name: deviceGuid
        in: path
        description: Device Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device activated or inactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below conflicts on the server,\nthe device doesn't exist, the device is already active or inactive, the device is shared device, \nmessage or device quota are exceeded to activate device only and invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateStatusRequest'
        description: Json object
      operationId: putApiV21DeviceByDeviceGuidStatus
      x-operation-id-source: derived
  /api/v2.1/Device/uniqueId/{uniqueId}:
    get:
      tags:
      - Device
      summary: Get all the details of single device
      description: Getting all the details of a device, including firmware update, device availability and when it was last connected, etc., is critical for any user. To get all the details of a device, you need to send the device uniqueId in request url. Moreover, if you wish to fetch child device details, send gateway device uniqueId in parentDeviceUniqueId parameter of a query string.
      parameters:
      - name: uniqueId
        in: path
        description: Device Unique Id
        required: true
        schema:
          type: string
      - name: parentDeviceUniqueId
        in: query
        description: Gateway Device Unique Id
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device information received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInformationResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            the device doesn''t exist and invalid logged user or company.'
      operationId: getApiV21DeviceUniqueIdByUniqueId
      x-operation-id-source: derived
  /api/v2.1/Device/lookup:
    get:
      tags:
      - Device
      summary: Get device lookup
      description: 'This API endpoint provides you the lookup of all available devices in your company.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: deviceTemplateGuid
        in: query
        description: To get device lookup by device template, required to pass device template guid.
        schema:
          type: string
          format: uuid
      - name: tag
        in: query
        description: To get device lookup by device tag.
        schema:
          type: string
      - name: iotEdgeEnabled
        in: query
        schema:
          type: boolean
      - name: getChildDevice
        in: query
        description: Required to pass 'true' for getting device lookup along with child devices and 'false' for getting device lookup without child devices.
        schema:
          type: boolean
      - name: excludeEdge
        in: query
        description: Required to pass 'false' for getting non-edge device lookup and 'true' for getting edge device lookup.
        schema:
          type: boolean
      - name: deviceEntityGuid
        in: query
        description: Entity guid
        schema:
          type: string
          format: uuid
      - name: hasVideoStream
        in: query
        description: Required to pass 'false' for getting non video stream device lookup and 'true' for getting video stream device lookup.
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLookupResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21DeviceLookup
      x-operation-id-source: derived
