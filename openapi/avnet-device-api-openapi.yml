      description: This API endpoint helps to validate external devices in bulk for the given entity guid and template code. For that, upload a JSON file in the file parameter, containing a template code and list of devices that you want to create under a given template code. Along with that, you also need to send entity guid in entityGuid parameter under which you want to create devices. This also allows you to make gateway devices in bulk. To add child devices, you need to put them under your gateway device in a JSON file.
      responses:
