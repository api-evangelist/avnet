openapi: 3.2.0
info:
  title: Avnet Certificate API
  version: '1.0'
  description: 'Operations tagged Certificate across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Certificate
  description: Certificate Api List
paths:
  /api/v2.1/Certificate:
    post:
      tags:
      - Certificate
      summary: Add new certificate
      description: Certificate verifies identity when a device enters in an IoT ecosystem, encrypts in-transit communications and protects networks from exploits. Overall, certificates safeguard systems and transmit information privately. Using this API endpoint, you can add new certificates to mqtt broker.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate uploaded successfully and returns created certificate guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Certificate name already exist, invalid certificate, certificate upload not allowed, an error occurred while uploading certificate on azure

            and invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                CertificateName:
                  type: string
                  description: Certificate Name
                CertificateType:
                  type: integer
                  format: int32
                CaCertificateFile:
                  type: string
                  format: binary
                JITSupport:
                  type: boolean
                IsCpidOptional:
                  type: boolean
                InvokingUser:
                  type: string
                  format: uuid
                Version:
                  type: string
                Culture:
                  type: string
                TokenCompanyGuid:
                  type: string
                  format: uuid
                CpId:
                  type: string
                Token:
                  type: string
                DebugInfo:
                  type: integer
                  format: int32
              required:
              - CertificateName
              - CertificateType
              - CaCertificateFile
      operationId: postApiV21Certificate
      x-operation-id-source: derived
    get:
      tags:
      - Certificate
      summary: Get device certificates list
      description: Get an entire list of device certificates using this API endpoint. You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. name, name asc, name desc etc
        schema:
          type: string
      - name: name
        in: query
        description: Search with certifiate name
        schema:
          type: string
      - name: status
        in: query
        description: 'Search with certifiate status, Eg: Expired, Verified and Pending'
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the certificate list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Invalid logged user or company.'
      operationId: getApiV21Certificate
      x-operation-id-source: derived
  /api/v2.1/Certificate/{certificateGuid}:
    delete:
      tags:
      - Certificate
      summary: Delete a certificate
      description: This API endpoint allows you to delete a device certificate. For that, you need to send certificateGuid in request url.
      parameters:
      - name: certificateGuid
        in: path
        description: Certificate Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDeleteResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Certificate doesn''t exist, an error occurred while deleting certificate on azure and invalid logged user or company.'
      operationId: deleteApiV21CertificateByCertificateGuid
      x-operation-id-source: derived
    get:
      tags:
      - Certificate
      summary: Get single certificate detail
      description: This API endpoint provides you the detailed description of single device certificate. For that, you need to send certificateGuid in request url.
      parameters:
      - name: certificateGuid
        in: path
        description: Certificate Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate information received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateDetailResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Certificate doesn''t exist and invalid logged user or company.'
      operationId: getApiV21CertificateByCertificateGuid
      x-operation-id-source: derived
  /api/v2.1/certificate/lookup/{authType}:
    get:
      tags:
      - Certificate
      summary: Get certificates lookup
      description: This API endpoint provides you the lookup list of available device certificates for the given certificate auth type.
      parameters:
      - name: authType
        in: path
        description: To get certificate lookup by auth type
        required: true
        schema:
          type: integer
          format: int32
      - name: jitSupport
        in: query
        description: Set to true to filter certificates with JIT provisioning support
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate information received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateLookupResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21CertificateLookupByAuthType
      x-operation-id-source: derived
  /api/v2.1/device/{deviceId}/self-signed-certificate:
    get:
      tags:
      - Certificate
      summary: Get self signed certificate for your device
      description: This API endpoint provides you certificate for communication with you self signed device. For that, you need to send deviceId (Eg.[CpId]-[uniqudId]) in request url.
      parameters:
      - name: deviceId
        in: path
        description: deviceId (Eg.[CpId]-[uniqudId])
        required: true
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate files received successfully.
          content:
            application/json:
              schema:
                type: string
                format: binary
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            An error occurred while generating self signed certificate and invalid logged user or company.'
      operationId: getApiV21DeviceByDeviceIdSelfSignedCertificate
      x-operation-id-source: derived
  /api/v2.1/Certificate/device/{uniqueId}:
    get:
      tags:
      - Certificate
      summary: Retrieve the certificate
      description: This API endpoint allows you to Retrieve the device certificate.
      parameters:
      - name: uniqueId
        in: path
        description: uniqueId.
        required: true
        schema:
          type: string
      - name: secondaryCert
        in: query
        description: secondaryCert.
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that Retrieve certificate information received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRetriveResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Certificate doesn''t exist, an error occurred while deleting certificate on azure and invalid logged user or company.'
      operationId: getApiV21CertificateDeviceByUniqueId
      x-operation-id-source: derived
  /api/v2.1/device/{uniqueId}/platform/{platformType}/certificate-bundle:
    get:
      tags:
      - Certificate
      summary: Get certificate for your device according to platformType
      description: This API endpoint provides you certificate for your device according to platformType. For that, you need to send uniqueId in request url.
      parameters:
      - name: uniqueId
        in: path
        description: uniqueId
        required: true
        schema:
          type: string
      - name: platformType
        in: path
        description: 'Platform type should be one of below items

          <ul><li>1. IoTConnect</li><li>2. iOS</li><li>3. Android</li></ul>'
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate files received successfully.
          content:
            application/json:
              schema:
                type: string
                format: binary
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            An error occurred while generating self signed certificate and invalid logged user or company.'
      operationId: getApiV21DeviceByUniqueIdPlatformByPlatformTypeCertificateBundle
      x-operation-id-source: derived
  /api/v2.1/device/certificate-import:
    post:
      tags:
      - Certificate
      summary: Device certificate import
      description: This API endpoint helps to import certificate in bulk. For that, upload a JSON file in the file parameter.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the external certificate process validated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCertificateImportResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device template doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: "The json file as per the file sample provided.Please download sample files form your IoTConnect Account.\n            <p><b>Notes :</b> File should be valid file, file content should be valid JSON, the device template code (dtCode) is required,\n            dtCode should be valid, the device uniqueId is required, not allowed duplicate uniqueId for parent devices,\n            uniqueId should be valid, not allowed duplicate child device uniqueId within parent device,\n            device tag should be valid, self or CA signed parent device uniqueId length should be less than or equal to 31 characters,\n            self or CA signed child device uniqueId length should be less than or equal to 64 characters,\n            TPM and Key device (parent/child) uniqueId length should be less than or equal to 128 characters,\n            device property key is required if passing properties of the device, not allowed duplicate property key, tag is required for gateway child device </p>"
                  format: binary
              required:
              - file
      operationId: postApiV21DeviceCertificateImport
      x-operation-id-source: derived
    get:
      tags:
      - Certificate
      summary: Get device certificate import list
      description: This API endpoint provides you the list of all imported device certificate batches. This will give you the current status of all batch import along with the count of certificate insert success and failure.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. createdDate desc, createdDate asc, createdDate.
        schema:
          type: string
      - name: isValidated
        in: query
        description: Set to true to get only validated certificate imports
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device batch import list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateImportListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21DeviceCertificateImport
      x-operation-id-source: derived
  /api/v2.1/device/certificate-import/{importBatchGuid}:
    get:
      tags:
      - Certificate
      summary: Get device certificate import file content
      description: This API endpoint provides you the import file content of a specific certificate import batch. For that, you need to send importBatchGuid in request url.
      parameters:
      - name: importBatchGuid
        in: path
        description: Import batch guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the certificate import file content received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConnectionResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Import batch doesn''t exist and invalid logged user or company.'
      operationId: getApiV21DeviceCertificateImportByImportBatchGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Certificate
      summary: Delete a device certificate import
      description: To delete a device certificate import, use this API endpoint. To do that, you need to send a importBatchGuid in request url that you want to delete.
      parameters:
      - name: importBatchGuid
        in: path
        description: import Batch Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the certificate deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateImportDeleteResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: ''
      operationId: deleteApiV21DeviceCertificateImportByImportBatchGuid
      x-operation-id-source: derived
  /api/v2.1/device/certificate-import-detail:
    post:
      tags:
      - Certificate
      summary: Get device certificate import list by guid
      description: This API endpoint provides you the list of all imported device certificate batches. This will give you the current status of all batch import along with the count of certificate insert success and failure.
      responses:
        '412':
