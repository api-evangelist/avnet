                $ref: '#/components/schemas/NoContentResult'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCertificateImportDetailRequest'
      operationId: postApiV21DeviceCertificateImportDetail
      x-operation-id-source: derived
  /api/v2.1/device/certificate-import-validate:
    post:
      tags:
      - Certificate
      summary: Device certificate import validate
      description: This API endpoint helps to validate device certificate import validate. For that, upload a JSON file in the file parameter, containing a template code and list of devices that you want to create under a given template code. Along with that, you also need to send entity guid in entityGuid parameter under which you want to create devices. This also allows you to make gateway devices in bulk. To add child devices, you need to put them under your gateway device in a JSON file.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device batch import process has started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCertificateValidateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device template doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCertificateValidateRequest'
      operationId: postApiV21DeviceCertificateImportValidate
      x-operation-id-source: derived
  /api/v2.1/device/certificate-import-init:
    post:
      tags:
      - Certificate
      summary: Device certificate import intialize
      description: This API endpoint helps to Intialize device certificate import. For that, upload a JSON file in the file parameter, containing a template code and list of devices that you want to create under a given template code. Along with that, you also need to send entity guid in entityGuid parameter under which you want to create devices. This also allows you to make gateway devices in bulk. To add child devices, you need to put them under your gateway device in a JSON file.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device batch import process has started successfully.
          content:
            application/json:
              schema:
