        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device template doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateBatchImportRequest'
      operationId: postApiV21DeviceCertificateImportInit
      x-operation-id-source: derived
  /api/v2/Certificate:
    post:
      tags:
      - Certificate
      summary: Add new certificate
      description: Certificate verifies identity when a device enters in an IoT ecosystem, encrypts in-transit communications and protects networks from exploits. Overall, certificates safeguard systems and transmit information privately. Using this API endpoint, you can add new certificates to Azure IoT Hub.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that certificate uploaded successfully and returns created certificate guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Certificate name already exist, invalid certificate, certificate upload not allowed, an error occurred while uploading certificate on azure

            and invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                CertificateName:
                  type: string
                  description: Certificate Name
                certificateFile:
                  type: string
                  description: Certificate file. Only .pem and .cer files are allowed.
                  format: binary
                IsSphereCerti:
                  type: boolean
                CertificateType:
                  type: integer
                  format: int32
                InvokingUser:
                  type: string
                  format: uuid
                Version:
                  type: string
                Culture:
                  type: string
                TokenCompanyGuid:
                  type: string
                  format: uuid
                CpId:
                  type: string
                Token:
                  type: string
                DebugInfo:
                  type: integer
                  format: int32
              required:
              - CertificateName
              - certificateFile
      operationId: postApiV2Certificate
      x-operation-id-source: derived
    get:
      tags:
      - Certificate
      summary: Get device certificates list
      description: Get an entire list of device certificates using this API endpoint. You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. name, name asc, name desc etc
        schema:
          type: string
      - name: name
        in: query
        description: Search with certifiate name
        schema:
