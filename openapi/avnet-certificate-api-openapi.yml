        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device batch import list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCertificateImportDetailResponse'
        '204':
