openapi: 3.2.0
info:
  title: /IOTCONNECT™ Device Wireless Device API
  description: 'Device REST API contains information of Device modules.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.1'
security:
- Bearer: []
tags:
- name: WirelessDevice
  description: Wireless Device Api List
paths:
  /api/v2.1/WirelessDevice:
    post:
      tags:
      - WirelessDevice
      summary: Add new wireless device
      description: 'IoT device is a smart device that supports internet connectivity. Through connectivity, established using IoT communication protocols, these devices can interact with other devices. Not only that, it grants remote access to a user for managing the device as per their needs. These devices can be anything from consumer devices, wearables, home appliances, industrial monitoring systems to security systems.


        Add wireless device using this API endpoint for easy integration with IoTConnect. The approach requires a device template, defining the features and type of wireless devices.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device is created successfully and returns created device guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nThe device template doesn't exist, entity doesn't exist, the device is already exists, invalid tag, \nno attributes found in device template, parent device doesn't exist, parent and child device tags are same \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WirelessDeviceCreateRequest'
        description: Json object with wireless device details.
      operationId: postApiV21WirelessDevice
      x-operation-id-source: derived
