        '200':
          description: Indicates that the device template is updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateUpdateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device template name already exists, device template not found, data type not found

            and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateRequest'
        description: Template update detail in json object
      operationId: putApiV21DeviceTemplateByTemplateGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Template
      summary: Delete device template
      description: To delete a device template, use this API endpoint. To do that, you need to pass a device template guid that you want to delete.
      parameters:
      - name: templateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device template is deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDeleteResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nDevice template not found, device template can not delete due to device template associated with device or rule or firmware \nand invalid logged user or company."
      operationId: deleteApiV21DeviceTemplateByTemplateGuid
      x-operation-id-source: derived
