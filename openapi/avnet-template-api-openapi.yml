openapi: 3.2.0
info:
  title: Avnet Template API
  version: '1.0'
  description: 'Operations tagged Template across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Template
  description: Template Api List
paths:
  /api/v2.1/device-template:
    post:
      tags:
      - Template
      summary: Add new Device Template
      description: 'To manage devices and their associated properties, one needs a pre-defined structure. A device template provides that structure by allowing you to create attributes, settings, properties, rules, commands and much more – all to help you to monitor and manage your device management system efficiently.


        By using the API endpoint of the device template, you can also create gateway supported device templates. To do that, enter tag parameter value in the request body. You can manage gateways in the same way as any other device of your device management system. you can also create lowbandwidth supported device templates. To do that, enter datalength parameter value in the request body.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device template is created successfully and returns created device template guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nDevice template name already exists, device template code already exists, firmware not exists, firmware not released \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
        description: Json object used as input
      operationId: postApiV21DeviceTemplate
      x-operation-id-source: derived
    get:
      tags:
      - Template
      summary: Get device template list
      description: 'Get the list of available device templates of your company using this API endpoint.


        Though filters are optional, you can add them as given in the parameters. To apply the filters, you need to pass these filters in query string.'
      parameters:
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: 'Sort by name and order, Eg: name asc'
        schema:
          type: string
      - name: AuthType
        in: query
        description: 'Authentication Type - 1: Key, 2: CA Signed Certificate, 3: Self Signed Certificate, 4: TPM, 5: Symmetric Key'
        schema:
          type: string
      - name: EdgeSupport
        in: query
        description: Pass value as true to get only edge templates
        schema:
          type: string
      - name: GatewaySupport
        in: query
        description: Pass value as true to get only gateway templates
        schema:
          type: string
      - name: DeviceCount
        in: query
        description: Filter for device count
        schema:
          type: string
      - name: RuleCount
        in: query
        description: Filter for rule count
        schema:
          type: string
      - name: AttributeCount
        in: query
        description: Filter for attribute count
        schema:
          type: string
      - name: TwinPropertyCount
        in: query
        description: Filter for twin property count
        schema:
          type: string
      - name: CommandCount
        in: query
        description: Filter for Command count
        schema:
          type: string
      - name: BytesCommandCnt
        in: query
        description: Filter for Command count
        schema:
          type: string
      - name: DeviceTemplateName
        in: query
        description: Search with device template name
        schema:
          type: string
      - name: IsLowBandwidth
        in: query
        description: Pass value as true to get only low bandwidth templates
        schema:
          type: boolean
      - name: MessageVersion
        in: query
        description: Filter for Message Type
        schema:
          type: string
      - name: greenGrass
        in: query
        schema:
          type: boolean
      - name: wireless
        in: query
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device template list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21DeviceTemplate
      x-operation-id-source: derived
  /api/v2.1/device-template/quick:
    post:
      tags:
      - Template
      summary: Add quick Device Template
      description: To create a device template with attributes, use this API endpoint. By using provided JSON format in request format, you can add a device template quickly.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the device template is created successfully and returns created device template guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateQuickResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device template name already exists, device template code already exists, data type not found

            and invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                File:
                  type: string
                  format: binary
                TemplateJSON:
                  type: string
      operationId: postApiV21DeviceTemplateQuick
      x-operation-id-source: derived
  /api/v2.1/device-template/{templateGuid}:
    put:
      tags:
      - Template
      summary: Update device template
      description: To update a device template, use this API endpoint. You can only update name, description and firmware hardware version of the device template.
      parameters:
      - name: templateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
