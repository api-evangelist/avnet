openapi: 3.2.0
info:
  title: /IOTCONNECT™ Device Azure Sphere API
  description: 'Device REST API contains information of Device modules.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: AzureSphere
  description: Azure Sphere Api List
paths:
  /api/v2/sphere-devices/products:
    get:
      tags:
      - AzureSphere
      summary: Get Sphere Product List
      description: This API endpoint gives you the list of sphere products.
      parameters:
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        schema:
          type: string
      - name: Name
        in: query
        schema:
          type: string
      - name: Description
        in: query
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the product list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2SphereDevicesProducts
      x-operation-id-source: derived
    post:
      tags:
      - AzureSphere
      summary: Create sphere product
      description: This API endpoint creates new sphere product.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the product created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCreateResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
        description: Json object with sphere product details.
      operationId: postApiV2SphereDevicesProducts
      x-operation-id-source: derived
  /api/v2/sphere-devices/products/{guid}:
    patch:
      tags:
      - AzureSphere
      summary: Update sphere product
      description: This API endpoint update sphere product.
      parameters:
      - name: guid
        in: path
        description: guid to update sphere product.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUpdateResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
        description: Json object with sphere product details.
      operationId: patchApiV2SphereDevicesProductsByGuid
      x-operation-id-source: derived
    delete:
      tags:
      - AzureSphere
      summary: Delete sphere product
      description: This API endpoint delete sphere product.
      parameters:
      - name: guid
        in: path
        description: productGuid to delete sphere product.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the product deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDeleteResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: deleteApiV2SphereDevicesProductsByGuid
      x-operation-id-source: derived
