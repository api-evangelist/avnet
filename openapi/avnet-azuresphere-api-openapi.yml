  /api/v2/sphere-devices/tenants/{tenantId}/permission:
    get:
      tags:
      - AzureSphere
      summary: Check iotconnect tenant has permission to access azure sphere tenant or not
      description: This API endpoint Check iotconnect tenant has permission to access azure sphere tenant or not.
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the iotconnect tenant has permission or not to access azure sphere tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPermissionResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
