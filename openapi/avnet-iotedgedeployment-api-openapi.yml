openapi: 3.2.0
info:
  title: /IOTCONNECT™ Firmware Io T Edge Deployment API
  description: 'Firmware REST API contains information of Device modules. It will give API methods to firmware communication and OTA.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: IoTEdgeDeployment
  description: IoTEdge Deployments Api List
paths:
  /api/v2/iot-edge/deployments:
    post:
      tags:
      - IoTEdgeDeployment
      summary: Create new IoT Edge Deployment
      description: ''
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that deployment completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTEdgeDeploymentCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Firmware name already exists, firmware software version already exists, firmware hardware version already exists

            and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IoTEdgeDeploymentCreateRequest'
      operationId: postApiV2IotEdgeDeployments
      x-operation-id-source: derived
    get:
      tags:
      - IoTEdgeDeployment
      summary: Get IoT edge deployment list
      description: 'This API endpoint provides you the list of iot edge deployments.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: 'To sort the list. To do that, Specify Field name to sort with and sorting order. eg: firstName asc'
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that deployment list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoTEdgeDeploymentListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      operationId: getApiV2IotEdgeDeployments
      x-operation-id-source: derived
