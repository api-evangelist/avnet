openapi: 3.2.0
info:
  title: Avnet Auth API
  version: '1.0'
  description: 'Operations tagged Auth across 2 of this provider''s published API definitions: avnet-iotconnect-auth-aws-prod-swagger.json, avnet-iotconnect-auth-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Auth
  description: Auth Api List
paths:
  /api/v2.1/Auth/basic-token:
    get:
      tags:
      - Auth
      summary: Generate basic token
      description: We are using the OAuth 2.0 protocol for authentication and authorization. Login API endpoint needs basic authentication to validate your request. This API endpoint will generate that basic authentication token, which you need for the Login API endpoint. This token informs the API that the bearer of the token has been authorized to access the Login API.
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that basic token is created successfully and returns generated basic token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicTokenCreateResponse'
      operationId: getApiV21AuthBasicToken
      x-operation-id-source: derived
  /api/v2.1/Auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: 'Before you can access private data using IoTConnect API, you must obtain an access token that grants access to that API. A single access token can grant varying degrees of access to multiple IoTConnect APIs. Once you get an access token, send it to IoTConnect API in an HTTP authorization header. Access tokens are valid only for the set of operations and resources described in the scope of the token. Along with an access token, you will also receive a refresh token. This refresh token allows you to get new access tokens.


        We are using the OAuth 2.0 protocol for authentication and authorization. To begin, obtain a basic token from the basic token API endpoint. Then, request an access token from the IoTConnect Authorization Server, extract a token from the response, and send the token to the IoTConnect API that you want to access.


        During the access token request, you need to pass your IoTConnect account username and password in body. While in Request Header, you need to submit basic token and solution key.'
      parameters:
      - name: solution-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that access token is created successfully and returns generated access token along with refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Indicates that authentication is failed because of the wrong username/password or the user is not authorized to access given solution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      operationId: postApiV21AuthLogin
      x-operation-id-source: derived
  /api/v2.1/Auth/refresh-token:
    post:
      tags:
      - Auth
      summary: Refresh access token
      description: 'Access tokens have a limited lifespan. If you need access to the IoTConnect API beyond the lifespan of a single access token, get a refresh token. A refresh token allows you to obtain new access tokens.


        During the refresh token request, you need to send refresh_token, which you received in the login API endpoint response.'
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that refresh token is created successfully and returns generated access token along with new refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Indicates that supplied refresh token is not valid.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      operationId: postApiV21AuthRefreshToken
      x-operation-id-source: derived
  /api/v2.1/Auth/verify-token:
    get:
      tags:
      - Auth
      summary: Verify access token
      description: This API endpoint verifies the validity of your access token.
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that access token is verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayBaseResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
      operationId: getApiV21AuthVerifyToken
      x-operation-id-source: derived
  /api/v2.1/Auth/m-login:
    post:
      tags:
      - Auth
      summary: Login from Mobile
      description: 'This Api endpoint will be used for mobile application login. Before your mobile device can access private data using IoTConnect API, you must obtain an access token that grants access to that API. A single access token can grant varying degrees of access to multiple IoTConnect APIs. Once you get an access token, send it to IoTConnect API in an HTTP authorization header. Access tokens are valid only for the set of operations and resources described in the scope of the token. Along with an access token, you will also receive a refresh token. This refresh token allows you to get new access tokens.


        We are using the OAuth 2.0 protocol for authentication and authorization. To begin, obtain a basic token from the basic token API endpoint. Then, request an access token from the IoTConnect Authorization Server, extract a token from the response, and send the token to the IoTConnect API that you want to access.


        During the access token request, you need to send username and password along with deviceType, osName, osVersion, uuid and deviceToken in the request body. While in Request Header, you need to submit a basic token and solution key.'
      parameters:
      - name: solution-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that access token is created successfully and returns generated access token along with refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileLoginResponse'
        '401':
          description: Indicates that authentication is failed because of the wrong username/password or the user is not authorized to access given solution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileLoginRequest'
      operationId: postApiV21AuthMLogin
      x-operation-id-source: derived
  /api/v2.1/Auth/cognito/login:
    post:
      tags:
      - Auth
      summary: Cognito Login
      parameters:
      - name: solution-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
