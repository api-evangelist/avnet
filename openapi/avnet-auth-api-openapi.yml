        '200':
          description: Indicates that the CognitoLogin request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CognitoLoginResponse'
        '401':
          description: Authentication failed due to invalid, expired, or missing token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CognitoLoginRequest'
        description: The request object
      operationId: postApiV21AuthCognitoLogin
      x-operation-id-source: derived
  /api/v2.1/Auth/cognito/validate-otp:
    post:
      tags:
      - Auth
      summary: Cognito Validate OTP
      parameters:
      - name: solution-key
        in: header
        required: true
        schema:
          type: string
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
