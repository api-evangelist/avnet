              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that the CognitoValidateOTP request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CognitoValidateOTPResponse'
        '401':
          description: Authentication failed due to invalid, expired, or missing token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CognitoValidateOTPRequest'
        description: The request object
      operationId: postApiV21AuthCognitoValidateOtp
      x-operation-id-source: derived
  /api/v2.1/Auth/cognito/change-password:
    post:
      tags:
      - Auth
      summary: Cognito Change Password
      responses:
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
