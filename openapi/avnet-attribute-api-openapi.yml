components:
  schemas:
    ErrorsResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        error:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorModel'
      additionalProperties: false
    AttributeLookupResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AttributeLookup'
        status:
          enum:
          - 100
          - 101
          - 102
          - 103
          - 200
          - 201
          - 202
          - 203
          - 204
          - 205
          - 206
          - 207
          - 208
          - 226
          - 300
          - 301
          - 302
          - 303
          - 304
          - 305
          - 306
          - 307
          - 308
          - 400
          - 401
          - 402
          - 403
          - 404
          - 405
          - 406
          - 407
          - 408
          - 409
          - 410
          - 411
          - 412
          - 413
          - 414
          - 415
          - 416
          - 417
          - 421
          - 422
          - 423
          - 424
          - 426
          - 428
          - 429
          - 431
          - 451
          - 500
          - 501
          - 502
          - 503
          - 504
          - 505
          - 506
          - 507
          - 508
          - 510
          - 511
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        count:
          type:
          - integer
          - 'null'
          format: int64
      additionalProperties: false
    AttributeUpdateRequest:
      required:
      - dataTypeGuid
      - deviceTemplateGuid
      - localName
      type: object
      properties:
        attributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AttributeUpdateObjects'
          description: Child's attribute list, This field is required if selected dataTypeGuid for the object.
        localName:
          maxLength: 100
          minLength: 1
          type: string
          description: "Template attribute name. \nIt should be alphanumeric and allows two consecutive '_' and must start with the alphabet. \nEg. Temperature, Humadity, oxygenIn1, Temperature_In, Temperature__Out, Oxygen_In__1  etc."
        displayName:
          maxLength: 200
          type:
          - string
          - 'null'
          description: "Template attribute displayName. \nIt should be alphanumeric and allows two consecutive '_' and must start with the alphabet. \nEg. Temperature, Humadity, oxygenIn1, Temperature_In, Temperature__Out, Oxygen_In__1  etc."
        description:
          maxLength: 250
          type:
          - string
          - 'null'
          description: Template attribute's description
        deviceTemplateGuid:
          minLength: 1
          type: string
          description: Associated Device Template Guid
        dataTypeGuid:
          minLength: 1
          type: string
          description: Attribute's Datatype Guid
        unit:
          maxLength: 100
          type:
          - string
          - 'null'
          description: Attribute's unit
        tag:
          maxLength: 50
          type:
          - string
          - 'null'
          description: "Attribute's tag, \nThe tag is required if the associated device template has enabled gateway support. \nThe Tag should be alphanumeric and allows two consecutive '_' and must start with the alphabet. \nEg. AC, Camera1 Camera_1, camera_Type__1 etc."
        aggregateType:
          type:
          - array
          - 'null'
          items:
            type: string
          description: "Attribute's aggregate type \nAggregate Types : Min, Max, Average, Sum, Latest Value."
        tumblingWindow:
          type:
          - string
          - 'null'
          description: "Attribute's tumbling window \nTumbling window should be 1 to 999 ending with h/m/s.<div> For example: </div><div>  5h (h = hour) </div><div> 5m (m = minute) </div><div> 5s (s = second)</div> \nThe tumbling window is required if the associated device template has enabled edge support."
        xmlAttributes:
          type:
          - object
          - 'null'
          readOnly: true
        startIndex:
          type:
          - integer
          - 'null'
          description: Start index is required if the associated device template has enabled low bandwidth support and data type is not an object.
          format: int32
        numChar:
          type:
          - integer
          - 'null'
          description: Range is required if the associated device template has enabled low bandwidth support and data type is not an objet.
          format: int32
        attributeColor:
          type:
          - string
          - 'null'
      additionalProperties: false
    AttributeUpdateObjects:
      required:
      - dataTypeGuid
      - localName
      type: object
      properties:
        guid:
          type:
          - string
          - 'null'
          description: Child attribute's guid
        localName:
          maxLength: 100
          minLength: 1
          type: string
          description: "Child attribute's name. \nIt should be alphanumeric and allows two consecutive '_' and must start with the alphabet. \nEg. Temperature, Humadity, oxygenIn1, Temperature_In, Temperature__Out, Oxygen_In__1  etc."
        displayName:
          maxLength: 200
          type:
          - string
          - 'null'
          description: "Template attribute displayName. \nIt should be alphanumeric and allows two consecutive '_' and must start with the alphabet. \nEg. Temperature, Humadity, oxygenIn1, Temperature_In, Temperature__Out, Oxygen_In__1  etc."
        description:
          maxLength: 250
          type:
          - string
          - 'null'
          description: Child attribute's description
        dataTypeGuid:
          minLength: 1
          type: string
          description: Child attribute's datatype guid, Object datatype is not allowed for child attributes.
        sequence:
          type:
          - integer
          - 'null'
          description: Child attribute's sequence
          format: int32
        unit:
          maxLength: 100
          type:
          - string
          - 'null'
          description: Child attribute's unit
        startIndex:
          type:
          - integer
          - 'null'
          description: Start index is required if the associated device template has enabled low bandwidth support.
          format: int32
        numChar:
          type:
          - integer
          - 'null'
          description: Range is required if the associated device template has enabled low bandwidth support.
          format: int32
        attributeColor:
          type:
          - string
          - 'null'
          description: Color Code of attribute.
        colorCode:
          type:
          - string
          - 'null'
        companyGuid:
          type:
          - string
          - 'null'
