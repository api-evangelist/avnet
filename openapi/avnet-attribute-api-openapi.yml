        '200':
          description: Indicates that the template attribute's sequence updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeUpdateSequenceResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            The device template doesn''t exist, attribute doesn''t exist and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdateSequenceRequest'
        description: Attribute json object
      operationId: putApiV21TemplateAttributeByAttributeGuidSequence
      x-operation-id-source: derived
  /api/v2.1/template-attribute/{deviceTemplateGuid}:
    get:
      tags:
      - Attribute
      summary: Get template attribute list
      description: 'This API endpoint gives you the list of available template attributes of your device template. For that, you need to send deviceTemplateGuid in request url.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: deviceTemplateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: searchtext
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: Sort by name and order. Eg. sequence, sequence asc, sequence desc etc
        schema:
          type: string
      - name: tag
        in: query
        description: Tag
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the template attribute list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device temmplate doesn''t exist and invalid logged user or company.'
      operationId: getApiV21TemplateAttributeByDeviceTemplateGuid
      x-operation-id-source: derived
  /api/v2.1/template-attribute/{deviceTemplateGuid}/lookup:
    get:
      tags:
      - Attribute
      summary: Get device template attribute lookup
      description: This API endpoint provides you the lookup list of available template attributes in your device template. For that, you need to send deviceTemplateGuid in request url.
      parameters:
      - name: deviceTemplateGuid
        in: path
        description: Device Template Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the template attribute lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeLookupResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Device temmplate doesn''t exist and invalid logged user or company.'
      operationId: getApiV21TemplateAttributeByDeviceTemplateGuidLookup
      x-operation-id-source: derived
