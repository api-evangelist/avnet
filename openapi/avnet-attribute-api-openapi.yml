openapi: 3.2.0
info:
  title: Avnet Attribute API
  version: '1.0'
  description: 'Operations tagged Attribute across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Attribute
  description: Attribute Api List
paths:
  /api/v2.1/template-attribute:
    post:
      tags:
      - Attribute
      summary: Add new template attribute
      description: 'This API endpoint allows you to create device template attributes. Attributes will be defined in your device template. One template can have one or more attributes. Your IoT devices will send the data for these template attributes.


        Here, localName and datatype are mandatory for any attribute, while a tag is mandatory for gateway supported templates only. The datatype of your attribute is predefined. If you select object datatype, you will be able to add child attributes for that attribute. Data validation allows you to set data numChar or specific data for attribute values.


        For Edge Enabled device, template must contain at least one attribute with datatype ''Number'' to send data to Hub.


        For Lowbandwidth Enabled device, template attribute must required startIndex and numChar.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the template attribute created successfully and returns created attribute guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nThe device template doesn't exist, tag is required if the device template has enabled gateway support, attribute name already exists, \nand invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreateRequest'
        description: Json object
      operationId: postApiV21TemplateAttribute
      x-operation-id-source: derived
  /api/v2.1/template-attribute/{attributeGuid}:
    put:
      tags:
      - Attribute
      summary: Update template attribute
      description: This API endpoint allows you to update the details of a device template attribute. For that, you need to send attributeGuid in request url and attribute update details in the request body.
      parameters:
      - name: attributeGuid
        in: path
        description: Template Attribute Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the template attribute updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nThe device template doesn't exist, attribute doesn't exist, attribute can not update if datatype guid for the object, \nattribute name already exists, attribute is associated with the rule, attribute is associated with power BI, \ntag is required if the device template has enabled gateway support and invalid logged user or company."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdateRequest'
        description: Attribute update detail json object
      operationId: putApiV21TemplateAttributeByAttributeGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Attribute
      summary: Delete a template attribute
      description: This API endpoint allows you to delete a device template attribute. For that, you need to send attributeGuid in request url.
      parameters:
      - name: attributeGuid
        in: path
        description: Template Attribute Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the template attribute deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDeleteResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts on the server.\nAn attribute doesn't exist, attribute/tag associated with thr device or a rule or command or power BI, at least one attribute required in device template \nand invalid logged user or company."
      operationId: deleteApiV21TemplateAttributeByAttributeGuid
      x-operation-id-source: derived
  /api/v2.1/template-attribute/{attributeGuid}/sequence:
    put:
      tags:
      - Attribute
      summary: Update template attribute sequence
      description: This API endpoint helps you to update a device template attribute sequence. For that, you need to send attributeGuid in request url and sequence number in the request body.
      parameters:
      - name: attributeGuid
