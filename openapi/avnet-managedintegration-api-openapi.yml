openapi: 3.2.0
info:
  title: /IOTCONNECT™ Master Managed Integration API
  description: 'Master REST API contains information of Dashboard, FAQ, Property (Custom Fields) Methods and other lockups data.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.1'
security:
- Bearer: []
tags:
- name: ManagedIntegration
  description: Managed Integration Api List
paths:
  /api/v2.1/ManagedIntegration/check-association:
    get:
      tags:
      - ManagedIntegration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAssociationResponse'
      summary: Get api managed integration check association
      x-summary-source: derived
      operationId: getApiV21ManagedIntegrationCheckAssociation
      x-operation-id-source: derived
  /api/v2.1/ManagedIntegration/create-association:
    post:
      tags:
      - ManagedIntegration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAssociationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssociationRequest'
      summary: Create api managed integration create association
      x-summary-source: derived
      operationId: postApiV21ManagedIntegrationCreateAssociation
      x-operation-id-source: derived
  /api/v2.1/ManagedIntegration/device-list:
    get:
      tags:
      - ManagedIntegration
      parameters:
      - name: connectorType
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
      summary: Get api managed integration device list
      x-summary-source: derived
      operationId: getApiV21ManagedIntegrationDeviceList
      x-operation-id-source: derived
  /api/v2.1/ManagedIntegration/send-command:
    post:
      tags:
      - ManagedIntegration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCommandResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCommandRequest'
      summary: Create api managed integration send command
      x-summary-source: derived
      operationId: postApiV21ManagedIntegrationSendCommand
      x-operation-id-source: derived
  /api/v2.1/ManagedIntegration/alexa-command:
    post:
      tags:
      - ManagedIntegration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlexaCommandResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlexaCommandRequest'
      summary: Create api managed integration alexa command
      x-summary-source: derived
      operationId: postApiV21ManagedIntegrationAlexaCommand
      x-operation-id-source: derived
  /api/v2.1/ManagedIntegration/command-history:
    get:
      tags:
      - ManagedIntegration
      parameters:
      - name: pageNumber
        in: query
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandHistoryListResponse'
      summary: Get api managed integration command history
      x-summary-source: derived
      operationId: getApiV21ManagedIntegrationCommandHistory
      x-operation-id-source: derived
