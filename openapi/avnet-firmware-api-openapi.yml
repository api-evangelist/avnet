openapi: 3.2.0
info:
  title: /IOTCONNECT™ Firmware API
  description: 'Firmware REST API contains information of Device modules. It will give API methods to firmware communication and OTA.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: Firmware
  description: Firmware Api List
paths:
  /api/v2/Firmware:
    post:
      tags:
      - Firmware
      summary: Add new firmware
      description: 'Firmware on the devices connected to the IoT hub needs to be updated as per the requirements. For example, you may need to add new features to the firmware or make your security patches stronger. You can update firmware remotely.


        This API endpoint allows you to create new firmware for your devices.


        Here, the hardware is a firmware hardware version. software is a firmware software version. firmwareFile requires a firmware file.


        Note : Once firmware created successfully API returns firmware details with firmwareUpgradeGuid and

        you must required to upload firmware file in file service with firmwareUpgradeGuid, for gateway device requires to send tag in file request body.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that firmware created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Firmware name already exists, firmware software version already exists, firmware hardware version already exists

            and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareCreateV2Request'
      operationId: postApiV2Firmware
      x-operation-id-source: derived
    get:
      tags:
      - Firmware
      summary: Get firmware list
      description: 'This API endpoint gives you a firmware list.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: Search Text
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. name asc, name desc, name etc
        schema:
          type: string
      - name: Name
        in: query
        description: Firmware name for search
        schema:
          type: string
      - name: Hardware
        in: query
        description: Hardware version for search
        schema:
          type: string
      - name: ReleaseCount
        in: query
        description: Release count for search
        schema:
          type: string
      - name: DraftCount
        in: query
        description: Draft count for search
        schema:
          type: string
      - name: IsLowBandwidth
        in: query
        schema:
          type: string
      - name: IsEdge
        in: query
        schema:
          type: string
      - name: IsGateway
        in: query
        schema:
          type: string
      - name: isIotEdgeEnable
        in: query
        schema:
          type: boolean
      - name: IsSphere
        in: query
        schema:
          type: string
      - name: TemplateName
        in: query
        schema:
          type: string
      - name: includeDeprecated
        in: query
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the firmware list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareGetListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2Firmware
      x-operation-id-source: derived
  /api/v2/Firmware/{firmwareGuid}:
    put:
      tags:
      - Firmware
      summary: Update Firmware
      description: This API endpoint allows you to update the firmware. For that, you need to send firmwareGuid in request url and updated firmware details in the request body. Status should be draft or released.
      parameters:
      - name: firmwareGuid
        in: path
        description: firmwareGuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that firmware updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareUpdateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            firmware not found, firmware name already exists, firmware software version already exists, firmware hardware version already exists,

            firmware status or firmware hardware version can not update if one or more firmware upgrade is released

            and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareUpdateV2Request'
        description: Json object
      operationId: putApiV2FirmwareByFirmwareGuid
      x-operation-id-source: derived
    get:
      tags:
      - Firmware
      summary: Get firmware details
      description: This API endpoint provides you a detailed description of firmware along with their upgrade details.
      parameters:
      - name: firmwareGuid
        in: path
        description: Firmware Guid. For multiple firmwareGuids send comma(,) separated list
        required: true
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the firmware details received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2FirmwareByFirmwareGuid
      x-operation-id-source: derived
  /api/v2/Firmware/lookup:
    get:
      tags:
      - Firmware
      summary: Get firmware lookup list
      description: This API endpoint gives you a firmware lookup list for devices.
      parameters:
      - name: isDraft
        in: query
        description: true for get draft firmwares.
        schema:
          type: boolean
      - name: includeDeprecated
        in: query
        schema:
          type: boolean
      - name: isEdge
        in: query
        description: 'IsEdge : Pass value as true to get only those firmwares which are associated with edge templates'
        schema:
          type: boolean
      - name: isGateway
        in: query
        description: 'IsGateway : Pass value as true to get only those firmwares which are associated with gateway templates'
        schema:
          type: boolean
      - name: isLowBandwidth
        in: query
        description: 'IsLowBandwidth : Pass value as true to get only those firmwares which are associated with lowbandwidth templates'
        schema:
          type: boolean
      - name: isIotEdgeEnable
        in: query
        description: 'IsIoTEdgeEnable : Pass value as true to get only those firmwares which are associated with IoTEdgeEnable templates'
        schema:
          type: boolean
      - name: isSphere
        in: query
        description: 'isSphere : Pass value as true to get only those firmwares which are sphere firmwares'
        schema:
          type: boolean
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the firmware lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareLookupResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2FirmwareLookup
      x-operation-id-source: derived
  /api/v2/firmware-validate:
    post:
      tags:
      - Firmware
      summary: Validate firmware
      description: This API endpoint validates your firmware details.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the firmware validated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareValidateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            firmware code already exists, firmware version already exists,

            invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareValidateRequest'
        description: Json object
      operationId: postApiV2FirmwareValidate
      x-operation-id-source: derived
  /api/v2/Firmware/{firmwareGuid}/deprecate:
    put:
      tags:
      - Firmware
      summary: Deprecate Firmware
      description: This API endpoint allows you to deprecate the firmware. For that, you need to send firmwareGuid in request url
      parameters:
      - name: firmwareGuid
        in: path
        description: firmwareGuid to deprecate firmware
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the firmware deprecated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareUpdateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            firmware not found, firmware is already deprecated and invalid logged user or company.'
      operationId: putApiV2FirmwareByFirmwareGuidDeprecate
      x-operation-id-source: derived
