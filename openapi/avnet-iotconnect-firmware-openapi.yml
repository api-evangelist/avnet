          default: false
        target:
          enum:
          - 1
          - 2
          - 3
          - 4
          type: integer
          description: target should be Entity=1, EntityWithSibling=2, Device=3 or ReportingGroup=4
          format: int32
        reportingGroupGuid:
          type: string
          description: Device reporting group guid
          format: uuid
          nullable: true
        isSphere:
          type: boolean
          description: To check if it is sphere OTA
          nullable: true
