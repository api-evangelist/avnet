openapi: 3.0.0
info:
  title: /IOTCONNECT™ Firmware API
  description: "Firmware REST API contains information of Device modules. It will give API methods to firmware communication\
    \ and OTA.\n<br /><h2>Headers</h2><p>Needed Headers for all the API. \n<br />\n<br /> Authorization &emsp;&nbsp;  &emsp;<b><i\
    \ style=\"font-style: italic !important;\">Bearer + access_token (Generated From api/v1.1/auth/login API)</i></b>\n<br\
    \ /> Content-Type &emsp;&nbsp;&emsp;<b><i style=\"font-style: italic !important;\">application/json</i></b></p>"
  version: '2.0'
  x-source: https://firmware.iotconnect.io/api/v2/swagger-json
  x-harvested: '2026-09-18'
  x-original: openapi/_original/avnet-iotconnect-firmware-azure-prod-swagger.json
  x-conversion: Swagger 2.0 -> OpenAPI 3.0.0 via swagger2openapi; operations, parameters, schemas and responses are as published
    — only servers[] and these x- provenance keys were added. No operationIds are published by the provider and none were
    invented.
  x-ownership: IoTConnect is Avnet's own IoT platform (docs.iotconnect.io is titled "Avnet /IOTCONNECT", carries "Copyright
    Avnet, Inc." and links github.com/avnet-iotconnect); the product lives on iotconnect.io rather than avnet.com.
servers:
- url: https://firmware.iotconnect.io
  description: /IOTCONNECT production (Azure platform) — the host the docs page resolves for env=prod&pf=az; paths carry the
    /api/v2 prefix
paths:
  /api/v2/Firmware:
    post:
      tags:
      - Firmware
      summary: Add new firmware
      description: "<p>Firmware on the devices connected to the IoT hub needs to be updated as per the requirements. For example,\
        \ you may need to add new features to the firmware or make your security patches stronger. You can update firmware\
        \ remotely.</p>\r\n<p>This API endpoint allows you to create new firmware for your devices.</p>\r\n<p>Here, the <i>hardware</i>\
        \ is a firmware hardware version. <i>software</i> is a firmware software version. <i>firmwareFile</i> requires a firmware\
        \ file.</p>\r\n<p>\r\n  <b>Note : </b>Once firmware created successfully API returns firmware details with firmwareUpgradeGuid\
        \ and \r\n            you must required to upload firmware file in file service with firmwareUpgradeGuid, for gateway\
        \ device requires to send tag in file request body.</p>"
      responses:
        '200':
          description: Indicates that firmware created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nFirmware name already exists, firmware software version already exists, firmware hardware\
            \ version already exists\r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareCreateV2Request'
    get:
      tags:
      - Firmware
      summary: Get firmware list
      description: "<p>This API endpoint gives you a firmware list.</p>\r\n<p>You can also add the filters as given in the\
        \ parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query\
        \ string.</p>"
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: Search Text
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. name asc, name desc,
          name etc
        schema:
          type: string
      - name: Name
        in: query
        description: Firmware name for search
        schema:
          type: string
      - name: Hardware
        in: query
        description: Hardware version for search
        schema:
          type: string
      - name: ReleaseCount
        in: query
        description: Release count for search
        schema:
          type: string
      - name: DraftCount
        in: query
        description: Draft count for search
        schema:
          type: string
      - name: IsLowBandwidth
        in: query
        schema:
          type: string
      - name: IsEdge
        in: query
        schema:
          type: string
      - name: IsGateway
        in: query
        schema:
          type: string
      - name: isIotEdgeEnable
        in: query
        schema:
          type: boolean
      - name: IsSphere
        in: query
        schema:
          type: string
      - name: TemplateName
        in: query
        schema:
          type: string
      - name: includeDeprecated
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Indicates that the firmware list received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareGetListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Firmware/{firmwareGuid}:
    put:
      tags:
      - Firmware
      summary: Update Firmware
      description: <p>This API endpoint allows you to update the firmware. For that, you need to send <i>firmwareGuid</i>
        in request url and updated firmware details in the request body. <i>Status</i> should be draft or released.</p>
      parameters:
      - name: firmwareGuid
        in: path
        description: firmwareGuid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareUpdateV2Request'
        description: Json object
      responses:
        '200':
          description: Indicates that firmware updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpdateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware not found, firmware name already exists, firmware software version already exists,\
            \ firmware hardware version already exists,\r\nfirmware status or firmware hardware version can not update if\
            \ one or more firmware upgrade is released\r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    get:
      tags:
      - Firmware
      summary: Get firmware details
      description: <p>This API endpoint provides you a detailed description of firmware along with their upgrade details.</p>
      parameters:
      - name: firmwareGuid
        in: path
        description: Firmware Guid. For multiple firmwareGuids send comma(,) separated list
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the firmware details received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/Firmware/lookup:
    get:
      tags:
      - Firmware
      summary: Get firmware lookup list
      description: <p>This API endpoint gives you a firmware lookup list for devices.</p>
      parameters:
      - name: isDraft
        in: query
        description: true for get draft firmwares.
        schema:
          type: boolean
      - name: includeDeprecated
        in: query
        schema:
          type: boolean
      - name: isEdge
        in: query
        description: 'IsEdge : Pass value as true to get only those firmwares which are associated with edge templates'
        schema:
          type: boolean
      - name: isGateway
        in: query
        description: 'IsGateway : Pass value as true to get only those firmwares which are associated with gateway templates'
        schema:
          type: boolean
      - name: isLowBandwidth
        in: query
        description: 'IsLowBandwidth : Pass value as true to get only those firmwares which are associated with lowbandwidth
          templates'
        schema:
          type: boolean
      - name: isIotEdgeEnable
        in: query
        description: 'IsIoTEdgeEnable : Pass value as true to get only those firmwares which are associated with IoTEdgeEnable
          templates'
        schema:
          type: boolean
      - name: isSphere
        in: query
        description: 'isSphere : Pass value as true to get only those firmwares which are sphere firmwares'
        schema:
          type: boolean
      responses:
        '200':
          description: Indicates that the firmware lookup received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareLookupResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/firmware-validate:
    post:
      tags:
      - Firmware
      summary: Validate firmware
      description: <p>This API endpoint validates your firmware details.</p>
      responses:
        '200':
          description: Indicates that the firmware validated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareValidateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware code already exists, firmware version already exists,\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareValidateRequest'
        description: Json object
  /api/v2/Firmware/{firmwareGuid}/deprecate:
    put:
      tags:
      - Firmware
      summary: Deprecate Firmware
      description: <p>This API endpoint allows you to deprecate the firmware. For that, you need to send <i>firmwareGuid</i>
        in request url</p>
      parameters:
      - name: firmwareGuid
        in: path
        description: firmwareGuid to deprecate firmware
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that the firmware deprecated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpdateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware not found, firmware is already deprecated and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/firmware-upgrade:
    post:
      tags:
      - FirmwareUpgrade
      summary: Add new firmware upgrade
      description: "<p>This API endpoint allows you to add new firmware software versions of your firmware.</p>\r\n<p>Here,\
        \ <i>firmwareGuid</i> defines you want the upgrade of which firmware. <i>Software</i> is a firmware software version.\
        \ The <i>firmwareFile</i> requires a firmware upgrade file.</p>\r\n<p>\r\n  <b>Note : </b>Once firmware upgrade created\
        \ successfully, API returns firmwareUpgradeGuid and \r\n            you must required to upload firmware file in file\
        \ service API with firmwareUpgradeGuid, for gateway device requires to send tag in file request body.</p>"
      responses:
        '200':
          description: Indicates that firmware upgrade created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpgradeCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware not found, firmware software version already exists and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareUpgradeCreateV2Request'
        description: Json object
    get:
      tags:
      - FirmwareUpgrade
      summary: Get firmware software list
      description: "<p>This API endpoint provides you the list of firmware software versions. To get software versions of\
        \ a particular firmware, you need to send firmware guid in the <i>firmwareGuid</i> parameter.</p>\r\n<p>Here, the\
        \ <i>type</i> parameter is mandatory. It must be draft or released.</p>\r\n<p>You can also add the filters as given\
        \ in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a\
        \ query string.</p>"
      parameters:
      - name: firmwareguid
        in: query
        description: Firmware guid
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        description: Firmware upgrade type should be draft or released or both.
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. version asc, version
          desc, version etc
        schema:
          type: string
      responses:
        '200':
          description: Indicates that firmware upgrade list received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpgradeGetListResonse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NoContentResult'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\ninvalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/firmware-upgrade/{firmwareUpgradeGuid}:
    put:
      tags:
      - FirmwareUpgrade
      summary: Update firmware upgrade
      description: "<p>This API endpoint helps you to update a firmware software version. For that, you need to send <i>firmwareUpgradeGuid</i>\
        \ in request url and updated firmware software version details in the request body.</p>\r\n<p>Here, <i>firmwareGuid</i>\
        \ defines you want the upgrade of which firmware. <i>Software</i> is a firmware software version. The <i>firmwareFile</i>\
        \ requires a firmware upgrade file.</p>"
      parameters:
      - name: firmwareUpgradeGuid
        in: path
        description: Firmware Upgrade Guid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirmwareUpgradeUpdateV2Request'
        description: Json object
      responses:
        '200':
          description: Indicates that firmware upgrade updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpgradeUpdateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nFirmware software version is released, firmware software version already exists, firmware\
            \ hardware version already exists\r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    delete:
      tags:
      - FirmwareUpgrade
      summary: Delete firmware upgrade
      description: <p>This API endpoint allows you to delete the firmware software version. For that, you need to send <i>firmwareUpgradeGuid</i>
        in request url.</p>
      parameters:
      - name: firmwareUpgradeGuid
        in: path
        description: Firmware upgrade Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: isDeleteSingleFirmware
        in: query
        description: "send true to forcefully delete if only this single draft firmware upgrade exists in firmware. \r\n \
          \           Otherwise systme will check that any other firmware upgrade must be exists in associated firmware"
        schema:
          type: boolean
      responses:
        '200':
          description: Indicates that firmware upgrade deleted successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware upgrade not found, released firmware upgrade can not delete, single firmware upgrade\
            \ can not delete\r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    get:
      tags:
      - FirmwareUpgrade
      summary: Get firmware upgrade details
      description: <p>This API endpoint gives you a detailed description of firmware upgrade details.</p>
      parameters:
      - name: firmwareUpgradeGuid
        in: path
        description: Firmware upgrade guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that firmware upgrade details received successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FirmwareUpGradeListResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware upgrade not found and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/firmware-upgrade/{firmwareUpgradeGuid}/publish:
    put:
      tags:
      - FirmwareUpgrade
      summary: Publish firmware upgrade
      description: <p>This API endpoint helps you to publish/release firmware software versions. For that, you need to send
        <i>firmwareUpgradeGuid</i> in request url. This lets you publish firmware software versions with draft status only.</p>
      parameters:
      - name: firmwareUpgradeGuid
        in: path
        description: Firmware upgrade guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that firmware upgrade publish process started successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PublishFirmwareUpgradeResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nfirmware upgrade not found, released firmware upgrade already published\r\nand invalid logged\
            \ user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
  /api/v2/firmware/{firmwareGuid}/lookup:
    get:
      tags:
