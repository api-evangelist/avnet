        \ send emails, show UI notifications, etc. whenever the rule is matched. In a rule, you can define the condition for\
        \ which you wish to monitor your device and configure the corresponding actions. Rule triggers when the selected device\
        \ telemetry crosses a specified threshold mentioned in the condition.</p>\r\n<p>This API endpoint allows you to create\
        \ rules. Here <i>name</i>, <i>templateGuid</i>, <i>severityLevelGuid</i>, <i>ruleType</i> and <i>applyTo</i> are mandatory\
        \ for any template rule. <i>conditionText</i> needs a condition on attribute values. If the condition is true, it\
        \ is considered as the rule matched.</p>"
