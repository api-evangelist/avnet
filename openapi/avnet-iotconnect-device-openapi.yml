      type: object
      properties:
        _WebhookMsgFormat:
          type: integer
          format: int32
          nullable: true
        isActive:
          type: boolean
          description: Active status, send false to Deactivate rule.
        ruleAudiences:
          type: array
          items:
            $ref: '#/components/schemas/RuleAudienceUpdate'
          description: Interval audience details for device disconnect event. if <i>ruleType</i> is 3
          nullable: true
        reportingGroupGuid:
          type: string
          description: Device Reporting Group Guid
          nullable: true
        templateGuid:
          minLength: 1
          type: string
          description: Device Template Guid
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Rule Name
        severityLevelGuid:
          minLength: 1
          type: string
          description: Severity Level Guid
        conditionText:
          maxLength: 1000
          minLength: 1
          type: string
          description: "Condition statement triggers Rule on telemetry data that meet specified criteria. Criteria are expressed\
            \ in the form of predicates.\r\n<div>Condition on attribute(localname) if device template is non gateway Eg. :\
            \ </div><div>1) Temperature > 50</div><div>2) Temperature > 50 AND Humidity < 20</div><div>3) Temperature > 50\
            \ AND ( Humidity < 20 OR WaterLevel > 10 )</div><div>4) Status = \"on\"</div><div></div><div>Condition on attribute({tag}#{localname})\
            \ if device template has enabled gateway enabled Eg. : </div><div>1) Tag1#Temperature > 50</div><div>2) Tag1#Temperature\
            \ > 50 AND Tag2#Humidity < 20</div><div>3) Tag1#Temperature > 50 AND ( Tag2#Humidity < 20 OR Tag2#WaterLevel >\
            \ 10 )</div><div>4) Tag3#Status = \"on\"</div>"
        ignorePreference:
          type: boolean
          description: If <i>true</i> then Ignore preference will send the notification to all the target audience irrespective
            of their preference
        entityGuid:
          type: string
          description: Entity Guid. if <i>applyTo</i> is 1 or 2
          nullable: true
        applyTo:
          maximum: 4
          minimum: 1
          type: integer
          description: "Send 1, 2 or 3. 1: for all device of entity, 2: for all device of entity including child entities,\
            \ 3: for device guid list.\r\nNote: <i>applyTo</i> must be 3 for edge template."
          format: int32
        devices:
          type: array
          items:
            type: string
          description: Device guid list. Required if <i>applyTo</i> is 3
          nullable: true
        roles:
          type: array
          items:
            type: string
          description: Role guid list. Notification will be sent to all users associated with these rules.
          nullable: true
        users:
          type: array
          items:
            type: string
          description: User guid list. Notification will be sent to all users in the list.
          nullable: true
        deliveryMethod:
          type: array
          items:
            type: string
          description: Notification delivery method. Eg. DeviceCommand, Email, Push, SignalR, WebHook, UI Alert, MQTT,UiNotification
          nullable: true
        commandGuid:
          type: string
          description: Command Guid. Required If <i>deliveryMethod</i> is DeviceCommand
          nullable: true
        parameterValue:
          type: string
          description: Command Value. Required if <i>deliveryMethod</i> is DeviceCommand
          nullable: true
        url:
          type: string
          description: Webhook url. Required If <i>deliveryMethod</i> is WebHook
          nullable: true
        webhookMsgFormat:
          maximum: 2
          minimum: 1
          type: integer
          description: Webhook message format should be Default Json = 1, Mini Json = 2
          format: int32
          nullable: true
        headers:
          type: array
          items:
            $ref: '#/components/schemas/WebHookBaseHeaderDetails'
          description: Webhook headers. If <i>deliveryMethod</i> is WebHook
          nullable: true
        snoozeTime:
          type: integer
          description: Snoonze time in unit to snooze rule once rule trigger if ruleType is 1 or 2
          format: int32
          nullable: true
        snoozeTimeUnit:
          type: integer
          description: "Snoonze time unit\r\n1 : Minute,\r\n2 : Hour,\r\n3 : Day\r\nNote : Default value is Minute if snoozeTime\
            \ having value"
          format: int32
          nullable: true
      additionalProperties: false
