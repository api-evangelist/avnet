  /api/v2/validate-external-device:
    post:
      tags:
      - Device
      summary: Validate External devices in batch
      description: <p>This API endpoint helps to validate external devices in bulk for the given entity guid and template
        code. For that, upload a JSON file in the <i>file</i> parameter, containing a template code and list of devices that
        you want to create under a given template code. Along with that, you also need to send entity guid in <i>entityGuid</i>
        parameter under which you want to create devices. This also allows you to make gateway devices in bulk. To add child
        devices, you need to put them under your gateway device in a JSON file.</p>
      responses:
        '200':
          description: Indicates that the external device process validated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ExternalDeviceValidateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nDevice template doesn't exist and invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                entityGuid:
                  type: string
                  format: uuid
                file:
                  description: "The json file as per the file sample provided.Please download sample files form your IoTConnect\
                    \ Account.\r\n            <p><b>Notes :</b> File should be valid file, file content should be valid JSON,\
                    \ the device template code (dtCode) is required,\r\n            dtCode should be valid, the device uniqueId\
                    \ is required, not allowed duplicate uniqueId for parent devices,\r\n            uniqueId should be valid,\
                    \ not allowed duplicate child device uniqueId within parent device,\r\n            device tag should be\
                    \ valid, self or CA signed parent device uniqueId length should be less than or equal to 31 characters,\r\
                    \n            self or CA signed child device uniqueId length should be less than or equal to 64 characters,\r\
                    \n            TPM and Key device (parent/child) uniqueId length should be less than or equal to 128 characters,\r\
                    \n            device property key is required if passing properties of the device, not allowed duplicate\
                    \ property key, tag is required for gateway child device </p>"
                  type: string
                  format: binary
                CertificateGuid:
                  description: The root certificate guid
                  type: string
                  format: uuid
                KId:
                  type: integer
                  format: int32
                ImportTypeGuid:
                  type: string
                  format: uuid
                DeviceTemplateGuid:
                  type: string
                  format: uuid
              required:
              - entityGuid
              - file
              - ImportTypeGuid
              - DeviceTemplateGuid
        required: true
