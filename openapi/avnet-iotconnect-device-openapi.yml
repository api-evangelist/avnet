  /api/v2/Device:
    post:
      tags:
      - Device
      summary: Add new device
      description: "<p>IoT device is a smart device that supports internet connectivity. Through connectivity, established\
        \ using IoT communication protocols, these devices can interact with other devices. Not only that, it grants remote\
        \ access to a user for managing the device as per their needs. These devices can be anything from consumer devices,\
        \ wearables, home appliances, industrial monitoring systems to security systems.</p>\r\n<p>Add any quantity and a\
        \ variety of devices using this API endpoint for easy integration with IoTConnect. The approach requires a device\
        \ template, defining the features and type of your devices. Features include attributes, settings, properties, rules,\
        \ commands and so on, by applying them on devices, users can monitor and manage.</p>"
      responses:
        '200':
          description: Indicates that the device is created successfully and returns created device guid.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeviceCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nThe device template doesn't exist, entity doesn't exist, the device is already exists, invalid\
            \ tag, \r\nno attributes found in device template, parent device doesn't exist, parent and child device tags are\
            \ same \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
        description: Json object with device details.
