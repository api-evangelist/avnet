openapi: 3.0.0
info:
  title: /IOTCONNECT™ Device API
  description: "Device REST API contains information of Device modules.\n<br /><h2>Headers</h2><p>Needed Headers for all the\
    \ API. \n<br />\n<br /> Authorization &emsp;&nbsp;  &emsp;<b><i style=\"font-style: italic !important;\">Bearer + access_token\
    \ (Generated From api/v1.1/auth/login API)</i></b>\n<br /> Content-Type &emsp;&nbsp;&emsp;<b><i style=\"font-style: italic\
    \ !important;\">application/json</i></b></p>"
  version: '2.0'
  x-source: https://device.iotconnect.io/api/v2/swagger-json
  x-harvested: '2026-09-18'
