  /api/v2/template-setting:
    post:
      tags:
      - Setting
      summary: Add new twin property
      description: "<p>Device twins are used to synchronize state information between a device and an IoT hub. Device twin\
        \ is a JSON document, associated with a specific device, and stored by IoT Hub in the cloud where you can query them.\
        \ Device twin contains desired properties, reported properties, and tags. The desired property is set by a back-end\
        \ application and read by a device. The reported property is set by a device and read by a back-end application. The\
        \ tag is set by a back-end application and is never sent to a device. Tags are used to organize devices.</p>\r\n<p>You\
        \ can add new twin properties using this API. These properties will be defined in your device template and will be\
        \ part of your device template. A single template can have one or more twin properties.</p>\r\n<p>Here name, <i>localName</i>,\
        \ <i>defaultValue</i> and <i>datatype</i> are mandatory for any twin property. Data validation allows you to set data\
        \ range or specific data for twin property values.</p>"
      responses:
        '200':
          description: Indicates that the twin property created successfully and returns created twin property guid.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SettingCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nThe device template doesn't exist, invalid data type, twin property key already exists and\
            \ invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingCreateRequest'
        description: Json object
