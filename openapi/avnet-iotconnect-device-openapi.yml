  /api/v2/Certificate:
    post:
      tags:
      - Certificate
      summary: Add new certificate
      description: <p>Certificate verifies identity when a device enters in an IoT ecosystem, encrypts in-transit communications
        and protects networks from exploits. Overall, certificates safeguard systems and transmit information privately. Using
        this API endpoint, you can add new certificates to Azure IoT Hub.</p>
      responses:
        '200':
          description: Indicates that certificate uploaded successfully and returns created certificate guid.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CertificateCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nCertificate name already exist, invalid certificate, certificate upload not allowed, an error\
            \ occurred while uploading certificate on azure\r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        $ref: '#/components/requestBodies/postApiV2Certificate'
    get:
      tags:
      - Certificate
      summary: Get device certificates list
      description: <p>Get an entire list of device certificates using this API endpoint. You can also add the filters as given
        in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query
        string.</p>
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
