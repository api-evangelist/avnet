        '200':
          description: Indicates that the ADU Group created successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ADUGroupCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ADUGroupCreateRequest'
  /api/v2/template-attribute:
    post:
      tags:
      - Attribute
      summary: Add new template attribute
      description: "<p>This API endpoint allows you to create device template attributes. Attributes will be defined in your\
        \ device template. One template can have one or more attributes. Your IoT devices will send the data for these template\
        \ attributes.</p>\r\n<p>Here, <i>localName</i> and <i>datatype</i> are mandatory for any attribute, while a tag is\
        \ mandatory for gateway supported templates only. The datatype of your attribute is predefined. If you select object\
        \ datatype, you will be able to add child attributes for that attribute. Data validation allows you to set data numChar\
        \ or specific data for attribute values.</p>\r\n<p>For Edge Enabled device, template must contain at least one attribute\
        \ with datatype 'Number' to send data to Hub.</p>\r\n<p>For Lowbandwidth Enabled device, template attribute must required\
        \ startIndex and numChar.</p>"
      responses:
        '200':
          description: Indicates that the template attribute created successfully and returns created attribute guid.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttributeCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nThe device template doesn't exist, tag is required if the device template has enabled gateway\
            \ support, attribute name already exists, \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeCreateRequest'
        description: Json object
  /api/v2/template-attribute/{attributeGuid}:
    put:
      tags:
      - Attribute
      summary: Update template attribute
      description: <p>This API endpoint allows you to update the details of a device template attribute. For that, you need
        to send <i>attributeGuid</i> in request url and attribute update details in the request body.</p>
      parameters:
      - name: attributeGuid
        in: path
        description: Template Attribute Guid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeUpdateRequest'
        description: Attribute update detail json object
      responses:
        '200':
          description: Indicates that the template attribute updated successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nThe device template doesn't exist, attribute doesn't exist, attribute can not update if datatype\
            \ guid for the object, \r\nattribute name already exists, attribute is associated with the rule, attribute is\
            \ associated with power BI, \r\ntag is required if the device template has enabled gateway support and invalid\
            \ logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
    delete:
      tags:
      - Attribute
      summary: Delete a template attribute
      description: <p>This API endpoint allows you to delete a device template attribute. For that, you need to send <i>attributeGuid</i>
        in request url.</p>
      parameters:
      - name: attributeGuid
        in: path
        description: Template Attribute Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Indicates that the template attribute deleted successfully.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttributeDeleteResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: "Indicates that the request could not be carried out because of one of the below or other conflicts\
            \ on the server.\r\nAn attribute doesn't exist, attribute/tag associated with thr device or a rule or command\
            \ or power BI, at least one attribute required in device template \r\nand invalid logged user or company."
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
