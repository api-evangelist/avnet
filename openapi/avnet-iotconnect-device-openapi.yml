                  type: integer
                  format: int32
                ImportTypeGuid:
                  type: string
                  format: uuid
                DeviceTemplateGuid:
                  type: string
                  format: uuid
              required:
              - entityGuid
              - file
              - ImportTypeGuid
              - DeviceTemplateGuid
