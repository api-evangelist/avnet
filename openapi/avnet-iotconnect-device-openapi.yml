      description: "<p>To manage devices and their associated properties, one needs a pre-defined structure. A device template\
        \ provides that structure by allowing you to create attributes, settings, properties, rules, commands and much more\
        \ – all to help you to monitor and manage your device management system efficiently.</p>\r\n<p>By using the API endpoint\
        \ of the device template, you can also create gateway supported device templates. To do that, enter <i>tag</i> parameter\
        \ value in the request body. You can manage gateways in the same way as any other device of your device management\
        \ system. you can also create lowbandwidth supported device templates. To do that, enter <i>datalength</i> parameter\
        \ value in the request body.</p>"
