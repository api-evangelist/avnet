                  format: uuid
                file:
                  description: "The json file as per the file sample provided.Please download sample files form your IoTConnect\
                    \ Account.\r\n            <p><b>Notes :</b> File should be valid file, file content should be valid JSON,\
                    \ the device template code (dtCode) is required,\r\n            dtCode should be valid, the device uniqueId\
                    \ is required, not allowed duplicate uniqueId for parent devices,\r\n            uniqueId should be valid,\
                    \ not allowed duplicate child device uniqueId within parent device,\r\n            device tag should be\
                    \ valid, self or CA signed parent device uniqueId length should be less than or equal to 31 characters,\r\
                    \n            self or CA signed child device uniqueId length should be less than or equal to 64 characters,\r\
