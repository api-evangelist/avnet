  /api/v2.1/User/forgot-password:
    post:
      tags:
      - User
      summary: Forgot password
      description: 'When you forget your password, you need to reset. For that, you need an invitation link that takes you to reset password page to change the password.


        This API endpoint allows you to send an invitation link to reset your password. For that, you need to send your login email id. It sends you an invitation link on your login email id. By using that url, you will be able to reset your password.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
