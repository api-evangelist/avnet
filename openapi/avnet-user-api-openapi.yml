  version: '1.0'
  description: 'Operations tagged User across 3 of this provider''s published API definitions: avnet-iotconnect-user-aws-prod-swagger.json, avnet-iotconnect-user-azure-prod-swagger.json, avnet-iotconnect-user-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://user.iotconnect.io
  description: /IOTCONNECT production (Azure platform) — the host the docs page resolves for env=prod&pf=az; paths carry the /api/v2 prefix
security:
- Bearer: []
tags:
- name: User
  description: User Api List
paths:
  /api/v2.1/User:
    post:
      tags:
      - User
      summary: Add new user
      description: 'This API endpoint allows you to add new users to your company.


        Here, the properties parameter is optional. entityGuid defines that the user belongs to which entity. You can get the list of available entities for your company from Entity API. roleGuid sets the permissions for a user. You can get the list of roles from Role API.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that user is created successfully and returns created user guid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Duplicate user email id, Entity doesn''t exist, Role doesn''t exist, Role is not active, User quota has been exceeded, Company doesn''t exist, Logged in user is not valid etc.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateV2Request'
        description: Json object
      operationId: postApiV21User
      x-operation-id-source: derived
    get:
      tags:
      - User
      summary: Get user list
      description: 'This API endpoint provides you the list of users in your company.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. eg: 25'
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: 'To sort the list. To do that, Specify Field name to sort with and sorting order. eg: firstName asc, lastName desc, roleName, entityName, userid, updatedDate, isActive'
        schema:
          type: string
      - name: FirstName
        in: query
        schema:
          type: string
      - name: LastName
        in: query
        schema:
          type: string
      - name: Email
        in: query
        schema:
          type: string
      - name: ContactNo
        in: query
        schema:
          type: string
      - name: Role
        in: query
        schema:
          type: string
      - name: Entity
        in: query
        schema:
          type: string
      - name: Status
        in: query
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that user list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGetListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
          content:
            application/json:
