      x-operation-id-source: derived
  /api/v2.1/User/{userGuid}:
    put:
      tags:
      - User
      summary: Update user details
      description: This API endpoint allows you to update user details like first name, last name, contact number, a role assigned, entity, or device allocation. For that, you need to send userGuid in request url and updated user details in the request body.
