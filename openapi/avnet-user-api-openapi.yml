  /api/v2.1/User/preference:
    get:
      tags:
      - User
      summary: Get user preference details
      description: This API endpoint gives you the user preference details for currently logged in users. User preferences show you that whether a user has opted for notifications. And if opted, what type of notifications. It also provides you page size preference and time zone detail.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
