              $ref: '#/components/schemas/ResetPasswordRequest'
        description: Json object
      operationId: postApiV21UserResetPassword
      x-operation-id-source: derived
  /api/v2.1/User/reset-password/resend:
    post:
      tags:
      - User
      summary: Resend reset password link
      description: This API endpoint allows you to resend the invitation link to the user’s email id to reset the password. For that, you need to send the user’s login email id in email parameter in the request body.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
