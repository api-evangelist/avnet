  /api/v2.1/User/reset-password:
    post:
      tags:
      - User
      summary: Reset password
      description: This API endpoint allows you to reset your password. For that, you need to send your login email id, invitation guid and your new password. An invitation will be generated at the time of creating a new user and when a user asks to reset the password using the forgot password API. You need that newly generated invitation’s guid in invitationGuid parameter in the request body.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that user has reset the password successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResetPasswordResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

