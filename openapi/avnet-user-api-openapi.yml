        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is not valid etc.'
      operationId: getApiV21UserPreference
      x-operation-id-source: derived
    put:
      tags:
      - User
      summary: Update user preference details
      description: 'When you create a user, default preferences set automatically for that user. Nevertheless, you can update those preferences anytime later.


        This API endpoint allows you to update currently logged in user’s preferences details.


        Here, you have an option to opt for notifications like email, sms, push. In case of email notifications, you have a choice whether you want to receive notifications on the primary email address (user’s login id) or secondary email address. If you opt for a secondary email, you need to enter that email address in alternateEmailID parameter. To change the user’s time zone, you need to send timeZoneGuid in the parameter. You can also get the list of available time zones from Master API.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
