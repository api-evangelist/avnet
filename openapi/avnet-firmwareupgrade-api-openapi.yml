        '200':
          description: Indicates that firmware upgrade lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmWareLookupListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2FirmwareUpgradeLookupByFirmwareGuid
      x-operation-id-source: derived
