openapi: 3.2.0
info:
  title: Avnet Property API
  version: '1.0'
  description: 'Operations tagged Property across 2 of this provider''s published API definitions: avnet-iotconnect-master-aws-prod-swagger.json, avnet-iotconnect-master-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Property
  description: Property Api List
paths:
  /api/v2.1/property-type:
    get:
      tags:
      - Property
      summary: Get property type list
      description: 'Property APIs allow you to create and manage custom properties. Custom properties have property types. Examples of property types are device, user, entity.


        This API endpoint provides you the list of property types. You need these property types at the time of creating a property.'
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that property type list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyTypeListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Company doesn''t exist, Logged in user is invalid etc.'
      operationId: getApiV21PropertyType
      x-operation-id-source: derived
  /api/v2.1/property-type/{propertyTypeId}:
    get:
      tags:
      - Property
      summary: Get properties for property type
      description: This API endpoint gives you the list of available properties under the given property type. For that, you need to send propertyTypeGuid in request url.
      parameters:
      - name: propertyTypeId
        in: path
        description: Property Type Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '403':
          description: Indicates that the user is not authorized to access this section.
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorModel'
        '200':
          description: Indicates that property list is loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
        '204':
          description: Indicates that the request has been successfully processed and no records found.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Property type doesn''t exist, Company doesn''t exist, Logged in user is invalid etc.'
      operationId: getApiV21PropertyTypeByPropertyTypeId
      x-operation-id-source: derived
  /api/v2.1/Property/field-type:
    get:
