        '200':
          description: Indicates that property is created successfully and returns created property id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyCreateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server

            Property type doesn''t exist, Duplicate property name, Company doesn''t exist, User is not valid etc.'
      requestBody:
