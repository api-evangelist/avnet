openapi: 3.2.0
info:
  title: Avnet File API
  version: '1.0'
  description: 'Operations tagged File across 2 of this provider''s published API definitions: avnet-iotconnect-file-aws-prod-swagger.json, avnet-iotconnect-file-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: File
  description: File Api List
paths:
  /api/v2.1/File:
    post:
      tags:
      - File
      summary: Upload a file
      description: This API endpoint allows you to upload files on the cloud. You can upload different files like user profile, device image, firmware file etc. For that, you need to send ModuleType, defining the type of file. The fileRefGuid is a reference guid, saying a file belongs to which module. For example, for a user profile, it requires a user guid to define that to which user the file belongs.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the file uploaded successfully and returns file details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAddResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileRefGuid:
                  type: string
                  format: uuid
                  description: "Reference Guid. \n            <b>Eg.</b><ul><li>deviceGuid for deviceimage</li><li>companyGuid for companylogo</li><li>firmwareUpgradeGuid for firmware</li><li>userGuid for userprofile</li><li>importBatchGuid for importbatch</li><li>solutionGuid for solutionimage</li><li>deviceCertificateGuid for devicecertificate</li><li>any guid for custom</li><li>moduleVersionGuid for module</li><li>dashboardWidgetGuid for widgetimage</li><li>dashboardBackgroundGuid for dashboardimage</li></ul>"
                Tag:
                  type: string
                  description: Tag of file
                ModuleType:
                  type: string
                  description: "Module type should be one of below items \n<ul><li>deviceimage</li><li>companylogo</li><li>firmware</li><li>userprofile</li><li>importbatch</li><li>solutionimage</li><li>devicecertificate</li><li>custom</li><li>module</li><li>widgetimage</li><li>deviceupdate</li><li>ggComponentArtifact</li><li>ggComponentRecipe</li><li>sagemakerModule</li></ul>"
                fileData:
                  type: string
                  description: Upload new file
                  format: binary
                CompanyGuid:
                  type: string
                  format: uuid
                  description: Company Guid.
              required:
              - fileRefGuid
              - ModuleType
      operationId: postApiV21File
      x-operation-id-source: derived
  /api/v2.1/File/{fileGuid}:
    put:
      tags:
      - File
      summary: Update File by file guid
      description: This API endpoint lets you update a file on the cloud. For that, you need to send fileGuid in request url and updated file in the request body.
      parameters:
      - name: fileGuid
        in: path
        description: File Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the file updated successfully and returns updated file details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpdateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                RunTime:
                  type: string
                ModuleType:
                  type: string
                  description: "Module type should be one of below items \n<ul><li>deviceimage</li><li>companylogo</li><li>firmware</li><li>userprofile</li><li>importbatch</li><li>solutionimage</li><li>devicecertificate</li><li>custom</li><li>module</li><li>widgetimage</li><li>deviceupdate</li><li>ggComponentArtifact</li><li>ggComponentRecipe</li><li>sagemakerModule</li></ul>"
                fileData:
                  type: string
                  description: Upload new file
                  format: binary
                CompanyGuid:
                  type: string
                  format: uuid
                  description: Company Guid.
              required:
              - ModuleType
      operationId: putApiV21FileByFileGuid
      x-operation-id-source: derived
  /api/v2.1/File/{moduleType}/{fileGuid}:
    delete:
      tags:
      - File
      summary: Delete a file
      description: This API endpoint permits you to delete a file from the cloud. For that, you need to send modelType and fileGuid in request url.
      parameters:
      - name: moduleType
        in: path
        description: 'Module type should be one of below items

          <ul><li>deviceimage</li><li>companylogo</li><li>firmware</li><li>userprofile</li><li>importbatch</li><li>solutionimage</li><li>devicecertificate</li><li>custom</li><li>module</li><li>widgetimage</li><li>deviceupdate</li><li>ggComponentArtifact</li><li>ggComponentRecipe</li></ul>'
        required: true
        schema:
          type: string
      - name: fileGuid
        in: path
        description: File Guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the file deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDeleteResponse'
        '204':
          description: Indicates that the file not found.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: deleteApiV21FileByModuleTypeByFileGuid
      x-operation-id-source: derived
