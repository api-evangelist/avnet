      tags:
      - Group
      summary: Get group type list
      description: This API endpoint provides you the list of available group types along with their active status.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that group type list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupTypeListResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV21GroupTypes
      x-operation-id-source: derived
  /api/v2.1/Group:
    post:
      tags:
      - Group
      summary: Add new group
      description: This API endpoint allows you to create a new group. Groups can be of devices or users. You can also add devices and users in the same group. For creating a group, you just need to mention a group name.
