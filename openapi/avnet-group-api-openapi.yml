              schema:
                $ref: '#/components/schemas/GroupCreateResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            Group name already exists and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
        description: Json object
      operationId: postApiV21Group
      x-operation-id-source: derived
    get:
      tags:
      - Group
      summary: Get group list
      description: 'This API endpoint provides you the list of available groups along with their active status as well as devices count and users count.


        You can also add filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
