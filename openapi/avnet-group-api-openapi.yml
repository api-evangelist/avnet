openapi: 3.2.0
info:
  title: Avnet Group API
  version: '1.0'
  description: 'Operations tagged Group across 2 of this provider''s published API definitions: avnet-iotconnect-device-aws-prod-swagger.json, avnet-iotconnect-device-azure-prod-swagger.json. Each path carries the servers of the definition it was published in.'
security:
- Bearer: []
tags:
- name: Group
  description: Group Api List
paths:
