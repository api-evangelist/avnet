openapi: 3.2.0
info:
  title: /IOTCONNECT™ Firmware Module API
  description: 'Firmware REST API contains information of Device modules. It will give API methods to firmware communication and OTA.


    Headers


    Needed Headers for all the API.


    Authorization    Bearer + access_token (Generated From api/v1.1/auth/login API)


    Content-Type    application/json'
  version: '2.0'
security:
- Bearer: []
tags:
- name: Module
  description: Module Api List
paths:
  /api/v2/module-type/lookup:
    get:
      tags:
      - Module
      summary: Get module type lookup list
      description: This API endpoint gives you a module type lookup list for module.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the module type lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleTypeLookupResponse'
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2ModuleTypeLookup
      x-operation-id-source: derived
  /api/v2/Module/lookup:
    get:
      tags:
      - Module
      summary: Get module lookup list
      description: This API endpoint gives you a module lookup list.
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that the module lookup received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleLookupResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2ModuleLookup
      x-operation-id-source: derived
  /api/v2/Module/{moduleGuid}:
    get:
      tags:
      - Module
      summary: Get module detail by moduleGuid
      description: This API endpoint gives you a detailed description of module details.
      parameters:
      - name: moduleGuid
        in: path
        description: moduleGuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module details received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetailResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            module not found and invalid logged user or company.'
      operationId: getApiV2ModuleByModuleGuid
      x-operation-id-source: derived
    put:
      tags:
      - Module
      summary: Update module by moduleGuid
      description: 'This API endpoint allows you to update the module. For that, you need to send moduleGuid in request url and updated module details in the request body.

        fileName is a module file name.version is a module version.'
      parameters:
      - name: moduleGuid
        in: path
        description: Module guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleUpdateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            module not found and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleUpdateRequest'
        description: Json object used as input
      operationId: putApiV2ModuleByModuleGuid
      x-operation-id-source: derived
    delete:
      tags:
      - Module
      summary: Delete module by moduleGuid
      description: This API endpoint allows you to delete the module. For that, you need to send moduleGuid in request url.
      parameters:
      - name: moduleGuid
        in: path
        description: Module guid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDeleteResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            module not found and invalid logged user or company.'
      operationId: deleteApiV2ModuleByModuleGuid
      x-operation-id-source: derived
  /api/v2/Module:
    get:
      tags:
      - Module
      summary: Get module list
      description: 'This API endpoint provides you the list of module.


        You can also add the filters as given in the parameters. Though the filters are optional, to apply them, you need to send these filter parameters in a query string.'
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. version asc, version desc, version etc
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2Module
      x-operation-id-source: derived
    post:
      tags:
      - Module
      summary: Add module
      description: 'Module on the devices connected to the IoT hub needs to be updated as per the requirements. For example, you may need to add new features to the module or make your AI stronger. You can update module remotely.


        This API endpoint allows you to create new module for your devices.


        Here, the moduleTypeGuid is a module type guid which you can get from module type lookup API endpoint. name is a module name. code is a module code.fileName is a module file name.version is a module version.


        Note : Once module created successfully, API returns moduleGuid and you must required to upload module file in file service API with moduleGuid.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleCreateResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            module type not found, module code already exists and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleCreateRequest'
        description: Json object used as input
      operationId: postApiV2Module
      x-operation-id-source: derived
  /api/v2/Module/push:
    post:
      tags:
      - Module
      summary: Push a module on multiple devices
      description: 'Push a module on multiple devices using this API endpoint. For that, you need to send either entityGuid or deviceGuid list along with moduleGuid in the request body.


        If you wish to send entityGuid, send value “1” in the applyTo parameter and entity guid in entityGuid parameter. This will push module to all the devices available in the given entity. With this entity devices you can also push this module to all devices which are exists in child entities. For that, you need to send value “true” in isRecursive parameter.


        If you wish to send deviceGuid list, send value “2” in the applyTo parameter and list of device guids in devices parameter. This will push module to selected devices only.'
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module push process started successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulePushResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            module not found, entity not found and invalid logged user or company.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModulePushRequestV2'
        description: Json object
      operationId: postApiV2ModulePush
      x-operation-id-source: derived
    get:
      tags:
      - Module
      summary: Get module push list
      parameters:
      - name: pageNumber
        in: query
        description: 'To fetch specific page data. Eg: 2'
        schema:
          type: integer
          format: int32
      - name: pageSize
        in: query
        description: 'To define number of records in single page. Eg: 25'
        schema:
          type: integer
          format: int32
      - name: searchText
        in: query
        description: To search for specific texts in the list.
        schema:
          type: string
      - name: sortBy
        in: query
        description: To sort the list. To do that, Specify Field name to sort with and sorting order. Eg. name asc, name desc, name etc
        schema:
          type: string
      responses:
        '412':
          description: Indicates that a condition set for this request is failed, and the request cannot be carried out.
        '401':
          description: Indicates that authentication is failed because of the token is invalid or expired or missing.
        '500':
          description: Indicates that the request could not be carried out because of some technical error on the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
        '200':
          description: Indicates that module push item list received successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulePushListResponse'
        '403':
          description: Indicates that the user is not authorized to access this section.
        '409':
          description: 'Indicates that the request could not be carried out because of one of the below or other conflicts on the server.

            invalid logged user or company.'
      operationId: getApiV2ModulePush
      x-operation-id-source: derived
