source: >-
  Registry metadata from pypi.org/pypi/<pkg>/json and registry.npmjs.org (search + package documents), NuGet
  registration index and search.maven.org, cross-checked against the GitHub organization avnet-iotconnect (103 public
  repos) and docs.iotconnect.io/iotconnect/sdk/sdk-flavors/. The Avnet API Portal (procurement) ships no client library
  at all — its How-To tells integrators to download the API definition after sign-in and build their own client.
summary:
