  note: >-
    Every first-party package belongs to the /IOTCONNECT platform. Two are on a registry (PyPI); the Node.js, .NET,
    Android, iOS and C SDKs are GitHub-source distributions with no registry release — the npm scope @avnet-iotc
    holds only a 2024 demo beta. A CLI (iotconnect-cli) ships inside iotconnect-rest-api.
